<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>インク・ペイントシステム — 3D TPS プロトタイプ (最小構成)</title>
<style>
  :root{
    --bg: #14161c;
    --panel: #1d2029;
    --ink: #ff5a1f;
    --ink-dark: #b5390f;
    --text: #eef0f4;
    --muted: #7d8394;
    --accent: #33e6c0;
  }
  html,body{
    margin:0; height:100%; overflow:hidden;
    background: var(--bg); color: var(--text);
    font-family: "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  #app{ position:relative; width:100vw; height:100vh; }
  canvas{ display:block; }

  #hud{
    position:absolute; top:12px; left:12px; right:12px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; font-variant-numeric: tabular-nums;
  }
  .card{
    background: rgba(13,14,18,.72); backdrop-filter: blur(4px);
    border: 1px solid #33384a; border-radius:8px; padding:8px 12px;
  }
  .label{ font-size:11px; color: var(--muted); letter-spacing:.08em; }
  #ink-gauge-outer{
    width:130px; height:8px; border-radius:4px; background:#0b0c10;
    overflow:hidden; margin-top:6px; border:1px solid #33384a;
  }
  #ink-gauge-inner{
    height:100%; width:100%;
    background: linear-gradient(90deg, var(--ink-dark), var(--ink));
    transition: width .08s linear;
  }
  #dummy-hp-outer{
    width:130px; height:6px; border-radius:3px; background:#0b0c10;
    overflow:hidden; margin-top:4px; border:1px solid #33384a;
  }
  #dummy-hp-inner{
    height:100%; width:100%;
    background: var(--accent);
    transition: width .08s linear;
  }

  #reticle{
    position:absolute; top:0; left:0; width:0; height:0;
    pointer-events:none;
  }
  .reticle-ring{
    position:absolute; top:50%; left:50%; width:15px; height:15px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1.6px solid rgba(255,255,255,.92);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4);
  }
  .reticle-dot{
    position:absolute; top:50%; left:50%; width:4px; height:4px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background: rgba(255,255,255,.95);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4);
  }
  /* 弾の拡散(spreadDeg)がこのラインの位置まで届く可能性がある、という
     目安を表す4本の線。中心からの距離は毎フレームJSで更新する。 */
  .reticle-line{
    position:absolute;
    background: rgba(255,255,255,.92);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4);
    transform:translate(-50%,-50%);
  }
  .reticle-line.vertical{ width:2px; height:14px; }
  .reticle-line.horizontal{ width:14px; height:2px; }

  #pointerlock-prompt{
    position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    background: rgba(13,14,18,.85); backdrop-filter: blur(4px);
    border: 1px solid #33384a; border-radius:8px;
    padding:9px 16px; text-align:center; cursor:pointer;
    font-size:12px; color: var(--muted); line-height:1.5;
    z-index:40; max-width:360px;
  }
  #pointerlock-prompt b{ color: var(--text); }
  #pointerlock-prompt.hidden{ display:none; }

  #scope-note{
    position:absolute; bottom:12px; left:12px; max-width:280px;
    font-size:10px; color: var(--muted); line-height:1.6;
    background: rgba(13,14,18,.6); border:1px solid #262a36;
    border-radius:6px; padding:6px 9px; pointer-events:none;
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="card">
      <div class="label">インク残量</div>
      <div id="ink-gauge-outer"><div id="ink-gauge-inner"></div></div>
    </div>
    <div class="card" style="text-align:right">
      <div class="label">ダミーHP</div>
      <div id="dummy-hp-outer"><div id="dummy-hp-inner"></div></div>
      <div id="kill-count" class="label" style="margin-top:6px;">撃破数: 0</div>
    </div>
  </div>
  <div id="reticle">
    <div class="reticle-ring"></div>
    <div class="reticle-dot"></div>
    <div id="reticle-line-top" class="reticle-line vertical"></div>
    <div id="reticle-line-bottom" class="reticle-line vertical"></div>
    <div id="reticle-line-left" class="reticle-line horizontal"></div>
    <div id="reticle-line-right" class="reticle-line horizontal"></div>
  </div>
  <div id="fov-state" class="label" style="position:absolute; top:12px; left:50%; transform:translateX(-50%); background:rgba(13,14,18,.6); padding:4px 10px; border-radius:6px; border:1px solid #262a36;">FOV: 55.0°(ヒト状態)</div>
  <div id="scope-note">最小プロトタイプ: 移動・TPS視点・スプラシューター1丁の発射のみ実装。<br>塗り判定/複数武器/スペシャルは未実装(次フェーズ)。<br>右クリック長押し=イカ状態(自陣インク上なら潜行)／Eキー長押し=投擲構え(FOVのみ、投擲自体は未実装)。</div>
  <div id="pointerlock-prompt"><b>クリックしてマウスルックを有効化</b><br>WASD移動／マウスで視点／左クリックで発射</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ==========================================================================
   3D TPS PROTOTYPE — scope for this milestone
   --------------------------------------------------------------------------
   Ported from the 2D top-down ink prototype. This step ONLY covers:
     - third-person camera (mouse look via pointer lock, orbiting behind
       the player at a fixed offset)
     - WASD movement relative to camera facing
     - a single weapon (スプラシューター) firing on left-click hold, with
       the same fire-interval / ink-cost / range figures as the 2D version
     - a practice dummy target with HP/respawn, so the feel of the weapon
       can be judged directly

   NOT yet ported (left for a later pass, once this movement/camera/weapon
   core feels right):
     - the ink coverage system (paint layer, turf-score points) — impacts
       are shown with a simple flat decal only, for visual feedback, not
       tracked as coverage. "自陣インク上か" for squid-speed purposes is
       still approximated via isOnOwnInk() (proximity to a decal); real
       team-ink tracking (and therefore "敵インク上でイカダッシュ不可" /
       can't-swim-on-enemy-ink) is not implemented.
     - the other two weapons, sub weapon, both specials
     - walls/obstacles, HUD overlays (pause/menu/customize)

   Movement now uses a real acceleration model (see getCurrentAccelMPerS2 /
   getTargetSpeedMPerS / updateMovement): base 0.01m/F² accel toward the
   weight-class-correct human/squid target speed, 0.02m/F² during
   firing/sub-special action states, and a Bold-Marker-only 0.015m/F²
   squid exception (currently unused since WEAPON.isBoldMarker is false).

   Camera fix: the camera previously sat IN FRONT of the player (offset
   along +forward instead of -forward), and the WASD/shot-direction math
   had a matching sign flip that happened to cancel out internally. Both
   are now unified through getAimDirection()/getFlatForward()/
   getFlatRight() so camera look direction, movement direction, and shot
   direction all agree, with the camera correctly trailing behind the
   player along the aim direction.

   FOV: camera.fov IS the vertical FOV (fovy) in Three.js — fovx is derived
   internally from fovy+aspect, so the given table's fovy values (55°/60°/
   38°) are set directly, with a smooth lerp between states. squid form and
   投擲構え are stubbed as FOV-only states for now (right-click / E key)
   since the underlying mechanics aren't ported yet.
   ========================================================================== */

// --------------------------------------------------------------------------
// Unit system: reuse the 2D prototype's line/meter convention so weapon
// numbers stay comparable. 1 line = 5m. Real-world Three.js units below are
// meters (1 unit = 1m).
// --------------------------------------------------------------------------
const METERS_PER_LINE = 5;
const DU_PER_METER = 10;
const FPS = 60;
function duPerFrameToMPerSec(v){ return (v / DU_PER_METER) * FPS; }
// DU/F² (1フレームあたりの速度変化量、DU単位) を m/s² へ変換。
// 1フレーム = 1/FPS 秒なので、フレーム基準の加速度を秒基準にするには FPS² を掛ける。
function duPerF2ToMPerS2(v){ return (v / DU_PER_METER) * FPS * FPS; }
function framesToSeconds(f){ return f / FPS; }
function linesToMeters(n){ return n * METERS_PER_LINE; }

// スプラシューター — same figures as the 2D prototype (see
// ink-paint-prototype.html WEAPONS[0] for the annotated source/derivation).
const WEAPON = {
  name: 'スプラシューター',
  weightClass: 'medium', // 中量級。スプラシューターは重量/軽量どちらの専用ギア補正も前提にしない標準速度帯のブキとして分類。
  isBoldMarker: false,   // ボールドマーカーのみイカ速の加速度が特別(基準の1.5倍)になるための判定フラグ。
  maxRangeLines: 2.7,
  fireIntervalSec: framesToSeconds(6),
  inkPerShot: 100 / 108,
  speedDU: 22.66,
  damageFalloff: { startFrame: 8, startDamage: 36.0, endFrame: 40, endDamage: 18.0, perFrameDecay: 0.5625 },
  spreadDeg: 4.86,
};

// ==========================================================================
// 移動速度テーブル (DU/フレーム) — ブキ重量ごとの実データ。
// ヒト速は自分のインク上/塗れない床の上でも変化しない(仕様通り一定)。
// イカ速は「自陣インク上」「インクのない床・塗れない床」で分岐する。
// 「敵インク上ではイカダッシュ不可(泳げない)」は、このプロトタイプに
// まだチーム/敵インクの概念が無いため未実装(コメントで明記のみ)。
// ==========================================================================
const HUMAN_SPEED_DU_PER_F = { light: 1.04, medium: 0.96, heavy: 0.88 };
const SQUID_SPEED_ON_INK_DU_PER_F = { light: 2.016, medium: 1.920, heavy: 1.728 };
const SQUID_SPEED_OFF_INK_DU_PER_F = 0.66; // 全ブキ重量共通、ギアの影響も受けない

// ==========================================================================
// 加速度の基準値 (DU/F²)
//  - 基準: 0.1 (ヒト速・イカ速・重量問わず、通常はこの値で目標速度へ加減速)
//  - ボールドマーカーのみイカ速加速度が 0.15 (基準の1.5倍。ヒト速は基準のまま)
//  - メイン射撃中／サブ・スペシャル攻撃中・構えモーション中は 0.2 (基準の2倍)。
//    ボールドマーカーでこの状態になっても 0.15×2=0.3 にはならず 0.2 のまま。
// ==========================================================================
const ACCEL_BASE_DU_PER_F2 = 0.1;
const ACCEL_BOLD_SQUID_DU_PER_F2 = 0.15;
const ACCEL_ACTION_DU_PER_F2 = 0.2;

const player = {
  ink: 100, maxInk: 100,
  regenRate: 10, // ink/sec, natural regen only (matches ヒト状態 in the 2D version)
  vx: 0, vz: 0, // 現在の実速度 (m/s, ワールド座標)。加速度システムにより毎フレーム目標速度へ漸近する。
  humanSpeed: duPerFrameToMPerSec(HUMAN_SPEED_DU_PER_F[WEAPON.weightClass]),
  squidSpeedOnInk: duPerFrameToMPerSec(SQUID_SPEED_ON_INK_DU_PER_F[WEAPON.weightClass]),
  squidSpeedOffInk: duPerFrameToMPerSec(SQUID_SPEED_OFF_INK_DU_PER_F),
  shootSpeed: 2.6,  // m/s while firing — 公式テーブルに射撃中速度の値は含まれないため、2Dプロトタイプ踏襲の暫定値のまま
};

// ==========================================================================
// Scene setup
// ==========================================================================
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161c);
scene.fog = new THREE.Fog(0x14161c, 40, 90);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 500);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
app.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Lighting
scene.add(new THREE.AmbientLight(0x8890a8, 0.7));
const sun = new THREE.DirectionalLight(0xfff2d8, 1.1);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

// Ground — a practice-range floor with a faint line grid, matching the
// 1-line(5m) spacing used in the 2D version's markers.
const ARENA_SIZE = linesToMeters(20); // 100m square, same order of size as the 2D canvas arena
const groundGeo = new THREE.PlaneGeometry(ARENA_SIZE, ARENA_SIZE);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x2a2d38, roughness: 0.95 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(ARENA_SIZE, ARENA_SIZE / METERS_PER_LINE, 0x46dc8c, 0x555b6e);
grid.position.y = 0.01;
grid.material.opacity = 0.35;
grid.material.transparent = true;
scene.add(grid);

// Boundary walls (simple visual + collision box) so the player can't walk
// off the practice range.
const WALL_HALF = ARENA_SIZE / 2;
function clampToArena(x, z, margin){
  return {
    x: Math.max(-WALL_HALF + margin, Math.min(WALL_HALF - margin, x)),
    z: Math.max(-WALL_HALF + margin, Math.min(WALL_HALF - margin, z)),
  };
}

// --------------------------------------------------------------------------
// Player character — ヒト状態 (human) model: a capsule-ish body (cylinder +
// sphere cap, since Three r128 has no CapsuleGeometry) plus a "beak" cone
// so facing direction reads at a glance from behind.
// --------------------------------------------------------------------------
const TEAM_COLOR = 0xff5a1f;
const playerGroup = new THREE.Group();
playerGroup.position.set(0, 0, 12);
scene.add(playerGroup);

const bodyMat = new THREE.MeshStandardMaterial({ color: TEAM_COLOR, roughness: 0.5, metalness: 0.05 });
const trunkGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.7, 12);
const trunkMesh = new THREE.Mesh(trunkGeo, bodyMat);
trunkMesh.position.y = 0.77;
trunkMesh.castShadow = true;
playerGroup.add(trunkMesh);

const capGeo = new THREE.SphereGeometry(0.42, 12, 10);
const capMesh = new THREE.Mesh(capGeo, bodyMat);
capMesh.position.y = 1.12;
capMesh.castShadow = true;
playerGroup.add(capMesh);

const beakGeo = new THREE.ConeGeometry(0.14, 0.4, 10);
const beakMesh = new THREE.Mesh(beakGeo, new THREE.MeshStandardMaterial({ color: 0xffe08a }));
beakMesh.rotation.x = Math.PI / 2;
beakMesh.position.set(0, 0.85, 0.5);
beakMesh.castShadow = true;
playerGroup.add(beakMesh);

// --------------------------------------------------------------------------
// イカ状態 (squid form) model: a squashed body + two trailing tentacles +
// two eye dots, facing the same +Z-local direction as the human model's
// beak so it stays aligned when playerGroup.rotation.y is applied. Hidden
// by default (form starts as 'human'); toggled in updatePlayerVisual().
// --------------------------------------------------------------------------
const squidGroup = new THREE.Group();
const squidMat = new THREE.MeshStandardMaterial({ color: TEAM_COLOR, roughness: 0.45 });
const squidBody = new THREE.Mesh(new THREE.SphereGeometry(0.4, 14, 12), squidMat);
squidBody.scale.set(1, 0.7, 1.15);
squidBody.position.y = 0.32;
squidBody.castShadow = true;
squidGroup.add(squidBody);

const eyeGeo = new THREE.SphereGeometry(0.055, 8, 8);
const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111318 });
const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.13, 0.4, 0.34); squidGroup.add(eyeL);
const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(0.13, 0.4, 0.34); squidGroup.add(eyeR);

for (const side of [-1, 1]){
  const tentacle = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.42, 8), squidMat);
  tentacle.position.set(side * 0.16, 0.1, -0.12);
  tentacle.rotation.x = Math.PI * 0.92;
  tentacle.rotation.z = side * 0.25;
  tentacle.castShadow = true;
  squidGroup.add(tentacle);
}
squidGroup.visible = false;
playerGroup.add(squidGroup);

// --------------------------------------------------------------------------
// インクタンクUI — displayed only while in squid form (both surfaced and
// submerged), floating just beside the player, matching the reference
// screenshots. A rotationally-symmetric cylinder + rim, so no billboard
// rotation is needed — it reads the same from any horizontal angle.
// The fill cylinder sits in its own group pivoted at the bottom, so
// scaling fillGroup.scale.y grows/shrinks it upward from the base.
// --------------------------------------------------------------------------
function createInkTank(){
  const group = new THREE.Group();
  const H = 0.5, R = 0.13;
  const outerCyl = new THREE.Mesh(
    new THREE.CylinderGeometry(R, R, H, 14),
    new THREE.MeshStandardMaterial({ color: 0x0b0c10, roughness: 0.6 })
  );
  group.add(outerCyl);
  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(R, 0.015, 6, 16),
    new THREE.MeshStandardMaterial({ color: 0x33384a, roughness: 0.4 })
  );
  rim.rotation.x = Math.PI / 2;
  rim.position.y = H / 2;
  group.add(rim);

  const fillGroup = new THREE.Group();
  fillGroup.position.y = -H / 2; // pivot at the tank's base
  const fillCyl = new THREE.Mesh(
    new THREE.CylinderGeometry(R * 0.86, R * 0.86, H, 14),
    new THREE.MeshBasicMaterial({ color: 0x33e6c0 })
  );
  fillCyl.position.y = H / 2; // grows upward from fillGroup's base pivot
  fillGroup.add(fillCyl);
  group.add(fillGroup);

  return { group, fillGroup };
}
const inkTank = createInkTank();
inkTank.group.visible = false;
scene.add(inkTank.group);

const PLAYER_RADIUS = 0.45;
const MUZZLE_HEIGHT = 0.95; // where shots originate, roughly shoulder height

// --------------------------------------------------------------------------
// "自陣インク上か" — approximated by checking whether the player is
// standing within any existing shot-impact decal's radius, since the full
// paint-coverage layer hasn't been ported to 3D yet (see the top-of-file
// scope note). This is enough to demo the surface/submerge visual switch;
// a real coverage sampler will replace it once painting is ported.
function isOnOwnInk(){
  const r = decalGeo.parameters.radius;
  for (const d of decals){
    const dx = d.mesh.position.x - playerGroup.position.x;
    const dz = d.mesh.position.z - playerGroup.position.z;
    if (dx * dx + dz * dz < r * r) return true;
  }
  return false;
}

// Switches between the human model, the surfaced squid model, and the
// fully-submerged look (both models hidden, only the ink puddle + tank UI
// showing) based on `form` and isOnOwnInk(). Also keeps the ink tank's
// fill level and position in sync every frame.
function updatePlayerVisual(){
  const submerged = form === 'squid' && isOnOwnInk();
  const showHuman = form === 'human';
  trunkMesh.visible = showHuman;
  capMesh.visible = showHuman;
  beakMesh.visible = showHuman;
  squidGroup.visible = form === 'squid' && !submerged;

  inkTank.group.visible = form === 'squid';
  if (inkTank.group.visible){
    inkTank.group.position.set(
      playerGroup.position.x + 0.55,
      playerGroup.position.y + 1.15,
      playerGroup.position.z
    );
    inkTank.fillGroup.scale.y = Math.max(0.001, player.ink / player.maxInk);
  }
}

// --------------------------------------------------------------------------
// Practice dummy target
// --------------------------------------------------------------------------
const dummy = {
  hp: 100, maxHp: 100,
  radius: 0.55,
  position: new THREE.Vector3(0, 0, -16),
};
const dummyMat = new THREE.MeshStandardMaterial({ color: 0x4b5063, roughness: 0.7 });
const dummyMesh = new THREE.Mesh(new THREE.CylinderGeometry(dummy.radius, dummy.radius, 1.7, 16), dummyMat);
dummyMesh.position.copy(dummy.position).setY(0.85);
dummyMesh.castShadow = true;
scene.add(dummyMesh);
let killCount = 0;

function respawnDummy(){
  dummy.hp = dummy.maxHp;
  updateDummyHpUI();
}
function updateDummyHpUI(){
  document.getElementById('dummy-hp-inner').style.width = (dummy.hp / dummy.maxHp * 100) + '%';
}

// ==========================================================================
// TPS camera + mouse look
// --------------------------------------------------------------------------
// yaw/pitch drive both the camera orbit and the player's facing direction
// (movement and shots go where the camera looks, same as the 2D
// prototype's mouse-look-driven aimAngle). Camera sits behind/above the
// player at a fixed offset and looks at a point slightly above the
// player's head.
// ==========================================================================
let yaw = Math.PI;   // facing -Z initially (toward the dummy)
let pitch = -0.18;   // radians, positive = looking up, negative = looking down
const PITCH_MIN = -1.2, PITCH_MAX = 0.9;
const MOUSE_SENSITIVITY = 0.0022;
const CAMERA_DISTANCE = 7.8;
const CAMERA_HEIGHT = 3.4;

// --------------------------------------------------------------------------
// Aim direction: single source of truth for camera look direction, shot
// direction, and (flattened, pitch ignored) movement direction, so all
// three always agree with each other and with the on-screen crosshair.
// Standard yaw/pitch -> unit vector conversion; forward at yaw=0,pitch=0 is
// +Z, matching the player mesh's un-rotated facing (see beakMesh above).
// --------------------------------------------------------------------------
function getAimDirection(){
  return new THREE.Vector3(
    Math.sin(yaw) * Math.cos(pitch),
    Math.sin(pitch),
    Math.cos(yaw) * Math.cos(pitch)
  );
}
function getFlatForward(){
  return new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
}
function getFlatRight(){
  // Matches Three.js's actual camera-right basis (right = forward × up),
  // so A/D strafe the way they visually appear on screen. (Previously
  // this returned the mirrored vector, which is why A strafed right and
  // D strafed left — now swapped to the correct sign.)
  return new THREE.Vector3(-Math.cos(yaw), 0, Math.sin(yaw));
}

// ==========================================================================
// 視野角 (FOV) — vertical FOV per player state, taken directly as fovy since
// THREE.PerspectiveCamera.fov IS the vertical field of view in degrees (fovx
// is derived automatically from fovy+aspect, so no separate calculation is
// needed here — fovx = 2*atan(aspect*tan(fovy/2)) happens inside Three.js's
// projection matrix).
//   ヒト状態: 55° / イカ状態: 60° / 投擲構え(最大ズーム時): 38°
// Priority when multiple could apply: 投擲構え > イカ状態 > ヒト状態,
// since you can't throw while squidded (same constraint as the 2D version).
// ==========================================================================
const FOV_HUMAN = 55;
const FOV_SQUID = 60;
const FOV_THROW_AIM = 38;
const FOV_LERP_SPEED = 10; // higher = snappier zoom transition

function targetFov(){
  if (throwAimHeld) return FOV_THROW_AIM;
  if (form === 'squid') return FOV_SQUID;
  return FOV_HUMAN;
}

// --------------------------------------------------------------------------
// Player form (human/squid) — stubbed for this milestone: holding the right
// mouse button toggles the FOV-relevant state only (matches the 2D
// prototype's right-click-to-squid convention). Full squid mechanics (swim
// speed, submerging into own ink) are not ported yet.
// --------------------------------------------------------------------------
let form = 'human';
// 投擲構え (throw-aim zoom) — stubbed the same way: holding E previews the
// max-zoom FOV a sub-weapon/special throw would reach. No sub weapon is
// implemented yet, so this is camera-only for now.
let throwAimHeld = false;

let pointerLocked = false;
document.getElementById('pointerlock-prompt').addEventListener('click', () => {
  renderer.domElement.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === renderer.domElement;
  document.getElementById('pointerlock-prompt').classList.toggle('hidden', pointerLocked);
});
document.addEventListener('mousemove', e => {
  if (!pointerLocked) return;
  yaw -= e.movementX * MOUSE_SENSITIVITY;
  pitch -= e.movementY * MOUSE_SENSITIVITY;
  pitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, pitch));
});

function updateCamera(dt){
  playerGroup.rotation.y = yaw;

  const dir = getAimDirection();
  // Camera sits BEHIND the player along the aim direction (subtract dir),
  // offset up to shoulder height, then pulled in slightly when looking far
  // up/down so it doesn't swing too wide.
  const distFactor = CAMERA_DISTANCE * (0.75 + 0.25 * Math.cos(pitch));
  const desiredPos = playerGroup.position.clone()
    .add(new THREE.Vector3(0, CAMERA_HEIGHT, 0))
    .addScaledVector(dir, -distFactor);

  // Simple raycast-free ground clamp so the camera never dips below floor.
  desiredPos.y = Math.max(desiredPos.y, 0.6);
  camera.position.copy(desiredPos);

  // Look along the same aim direction the crosshair/shots use, from a point
  // just above the player's head — keeps camera, crosshair, and shot
  // direction all in agreement.
  const lookTarget = playerGroup.position.clone()
    .add(new THREE.Vector3(0, 1.3, 0))
    .addScaledVector(dir, 10);
  camera.lookAt(lookTarget);

  // Smoothly lerp toward the state-appropriate FOV rather than snapping,
  // matching the "だんだんズームされる" (gradual zoom) description.
  const t = 1 - Math.exp(-FOV_LERP_SPEED * dt);
  camera.fov += (targetFov() - camera.fov) * t;
  camera.updateProjectionMatrix();
}

// ==========================================================================
// Movement (WASD, relative to camera/player yaw — matches the 2D
// prototype's "aim direction independent of strafe direction" feel, since
// yaw here doubles as both facing and camera direction).
// ==========================================================================
const keys = { w:false, a:false, s:false, d:false };
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k in keys) keys[k] = true;
  // 投擲構え(スタブ): Eを押している間、最大ズーム時のFOVへ向けて滑らかに
  // ズームする。実際のサブウェポン投擲はまだ未実装。
  if (k === 'e') throwAimHeld = true;
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k in keys) keys[k] = false;
  if (k === 'e') throwAimHeld = false;
});

let mouseDown = false;

// ==========================================================================
// レティクル(照準)
// --------------------------------------------------------------------------
// 中央の円は常に画面中央=現在の照準方向(getAimDirection()と一致)に固定。
// 上下左右4本の線は、ブキの拡散角(WEAPON.spreadDeg)が実際に画面上で
// どこまで広がりうるかを、現在のFOV(投擲構え/イカ状態でのズームも含む)を
// 使って画面ピクセルへ投影した位置に毎フレーム配置し直す。
// ズームでFOVが狭くなるほど、同じ拡散角でも見た目の広がりは大きくなる
// (実際の弾のバラつきと視覚上のスケールが一致する)。
// ==========================================================================
const reticleTop = document.getElementById('reticle-line-top');
const reticleBottom = document.getElementById('reticle-line-bottom');
const reticleLeft = document.getElementById('reticle-line-left');
const reticleRight = document.getElementById('reticle-line-right');
const RETICLE_LINE_HALF = 7; // .reticle-line の長辺の半分(px)。中心からの隙間を作らないための詰め代
const RETICLE_MIN_OFFSET = 9;   // 拡散角が非常に小さくても最低限これだけ中心から離す
const RETICLE_MAX_OFFSET = 160; // 画面外まで広がらないようにクランプ

function updateReticle(){
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;

  // 拡散は角度の半値(±spreadDeg/2)が実際の最大ブレ幅なので、その半値を
  // 現在のFOVの半値との比でスクリーン縦半分(px)に投影する。
  const halfSpreadRad = (WEAPON.spreadDeg / 2) * Math.PI / 180;
  const halfFovRad = camera.fov * Math.PI / 360;
  const rawOffset = (Math.tan(halfSpreadRad) / Math.tan(halfFovRad)) * cy;
  const offset = Math.max(RETICLE_MIN_OFFSET, Math.min(RETICLE_MAX_OFFSET, rawOffset)) + RETICLE_LINE_HALF;

  reticleTop.style.left = cx + 'px';
  reticleTop.style.top = (cy - offset) + 'px';
  reticleBottom.style.left = cx + 'px';
  reticleBottom.style.top = (cy + offset) + 'px';
  reticleLeft.style.left = (cx - offset) + 'px';
  reticleLeft.style.top = cy + 'px';
  reticleRight.style.left = (cx + offset) + 'px';
  reticleRight.style.top = cy + 'px';
}
renderer.domElement.addEventListener('mousedown', e => {
  if (!pointerLocked){ renderer.domElement.requestPointerLock(); return; }
  if (e.button === 0) mouseDown = true;
  // イカ状態: 右クリック長押しの間、姿とFOV(60°)を切り替える。自陣インクの
  // 上ならインクの中に潜った見た目になる(isOnOwnInk()参照、既存の着弾
  // デコールで近似判定)。泳ぐ速度変化など塗り連動のゲームプレイ本体は
  // まだ未実装(次フェーズ)。
  if (e.button === 2) form = 'squid';
});
window.addEventListener('mouseup', e => {
  if (e.button === 0) mouseDown = false;
  if (e.button === 2) form = 'human';
});
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

// ==========================================================================
// 加速度システム
// --------------------------------------------------------------------------
// 基準加速度は 0.01m/F²(0.1DU/F²)。スティックを全力で倒した際、この値で
// 1フレームごとに目標速度へ近づいていく。目標速度がゼロ(キーを離した)や
// 逆方向(反対キーを倒した)の場合の減速も、同じ加速度の値で速度が
// マイナス方向に変化していくだけ(=同じ式で加減速両方をカバーできる)。
//
// 状態による例外:
//   ・ボールドマーカーのみ、イカ速のときの加速度が 0.015m/F²(1.5倍)。
//     ヒト速の加速度は他ブキと同じ基準値のまま変化しない。
//   ・メイン射撃中、またはサブ・スペシャルの攻撃中/構えモーション中は、
//     加速度が 0.02m/F²(基準の2倍)になる。これらの動作中にイカ状態へ
//     切り替わった場合もこの値が優先して適用される(ボールドマーカーの
//     1.5倍とは重複しない=0.15×2の3倍にはならず、常に0.02のまま)。
//
// t = 最高速度 ÷ 加速度 で最高速到達までのフレーム数が求まる
// (例: ボールドマーカーのイカ速 2.016DU/F ÷ 0.15DU/F² = 13.44F ≈ 14F —
//  この関係は m/s ÷ m/s² = 秒 でも同様に成立するため、下記は秒基準の
//  dt積分で実装しても仕様と一致する)。
// ==========================================================================
function getCurrentAccelMPerS2(actionState){
  if (actionState) return duPerF2ToMPerS2(ACCEL_ACTION_DU_PER_F2);
  if (form === 'squid' && WEAPON.isBoldMarker) return duPerF2ToMPerS2(ACCEL_BOLD_SQUID_DU_PER_F2);
  return duPerF2ToMPerS2(ACCEL_BASE_DU_PER_F2);
}

// 現在の状態(ヒト/イカ、射撃中、自陣インク上か)から目標最高速度(m/s)を返す。
// ヒト速は仕様通り、インクの有無や床の種類による変化を持たない。
function getTargetSpeedMPerS(firing){
  if (form === 'squid'){
    // 「敵インク上ではイカダッシュ不可(泳げない)」は、このプロトタイプに
    // チーム/敵インクの概念がまだ無いため未実装。自陣インク判定は既存の
    // isOnOwnInk()(着弾デコールへの近接判定)による近似のまま。
    return isOnOwnInk() ? player.squidSpeedOnInk : player.squidSpeedOffInk;
  }
  return firing ? player.shootSpeed : player.humanSpeed;
}

function updateMovement(dt, firing, actionState){
  let moveX = 0, moveZ = 0;
  if (keys.w) moveZ -= 1;
  if (keys.s) moveZ += 1;
  if (keys.a) moveX -= 1;
  if (keys.d) moveX += 1;
  const hasInput = moveX !== 0 || moveZ !== 0;

  let targetVX = 0, targetVZ = 0;
  if (hasInput){
    const len = Math.hypot(moveX, moveZ);
    moveX /= len; moveZ /= len;

    // Movement stays flat (pitch ignored) and uses the same yaw-derived
    // forward/right basis as getAimDirection()/getFlatForward(), so 'W'
    // always walks toward where the camera/crosshair is pointing.
    const forward = getFlatForward(), right = getFlatRight();
    const worldX = -moveZ * forward.x + moveX * right.x;
    const worldZ = -moveZ * forward.z + moveX * right.z;

    const targetSpeed = getTargetSpeedMPerS(firing);
    targetVX = worldX * targetSpeed;
    targetVZ = worldZ * targetSpeed;
  }
  // 入力が無ければ目標速度はゼロ = 現在の加速度でブレーキがかかっていく

  const accel = getCurrentAccelMPerS2(actionState);
  const dvx = targetVX - player.vx;
  const dvz = targetVZ - player.vz;
  const dvLen = Math.hypot(dvx, dvz);
  const maxStep = accel * dt;

  if (dvLen <= maxStep || dvLen === 0){
    player.vx = targetVX;
    player.vz = targetVZ;
  } else {
    // 目標速度への差分ベクトルの向きへ、加速度分だけ速度を変化させる。
    // 逆方向入力時もこの式のまま(差分ベクトルが大きくなるだけ)で、
    // 同じ加速度でゼロを通過して減速→加速する挙動になる。
    player.vx += (dvx / dvLen) * maxStep;
    player.vz += (dvz / dvLen) * maxStep;
  }

  const nx = playerGroup.position.x + player.vx * dt;
  const nz = playerGroup.position.z + player.vz * dt;
  const clamped = clampToArena(nx, nz, PLAYER_RADIUS);
  playerGroup.position.x = clamped.x;
  playerGroup.position.z = clamped.z;
  // 壁でクランプされた軸は速度も止める(張り付いたまま速度だけ溜まるのを防止)。
  if (clamped.x !== nx) player.vx = 0;
  if (clamped.z !== nz) player.vz = 0;
}

// ==========================================================================
// Weapon: single-shot spawn, straight-line travel, dummy/range/bounds hit
// check. No falloff-based splat/paint yet — impacts leave a flat decal
// purely for visual feedback (not scored, not sampled for anything).
// ==========================================================================
const projectiles = [];
const projGeo = new THREE.SphereGeometry(0.05, 8, 8);
const projMat = new THREE.MeshBasicMaterial({ color: 0xffd8c2 });

const decalGeo = new THREE.CircleGeometry(0.35, 16);
const decalMat = new THREE.MeshBasicMaterial({ color: TEAM_COLOR, transparent: true, opacity: 0.85 });
const decals = [];

let lastShotAt = 0;

function fireShot(){
  if (player.ink < WEAPON.inkPerShot) return;
  player.ink -= WEAPON.inkPerShot;

  const spread = (Math.random() - 0.5) * WEAPON.spreadDeg * Math.PI / 180;
  const angle = yaw + spread;
  // Same aim-direction convention as the camera (getAimDirection()), so
  // shots always travel exactly where the crosshair/camera is pointing.
  const dir = new THREE.Vector3(
    Math.sin(angle) * Math.cos(pitch),
    Math.sin(pitch),
    Math.cos(angle) * Math.cos(pitch)
  ).normalize();

  const origin = playerGroup.position.clone().add(new THREE.Vector3(0, MUZZLE_HEIGHT, 0));
  const mesh = new THREE.Mesh(projGeo, projMat);
  mesh.position.copy(origin);
  scene.add(mesh);

  projectiles.push({
    mesh,
    pos: origin.clone(),
    dir,
    speed: duPerFrameToMPerSec(WEAPON.speedDU),
    traveled: 0,
    range: linesToMeters(WEAPON.maxRangeLines),
    frameCount: 0,
    alive: true,
  });
}

function spawnDecal(pos){
  const mesh = new THREE.Mesh(decalGeo, decalMat.clone());
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(pos.x, 0.02, pos.z);
  scene.add(mesh);
  decals.push({ mesh, bornAt: performance.now() });
  // Cap decal count so the scene doesn't grow forever in this prototype.
  if (decals.length > 120){
    const old = decals.shift();
    scene.remove(old.mesh);
  }
}

function getShotDamage(frameNumber){
  const f = WEAPON.damageFalloff;
  if (frameNumber <= f.startFrame) return f.startDamage;
  if (frameNumber >= f.endFrame) return f.endDamage;
  const raw = f.startDamage - f.perFrameDecay * (frameNumber - f.startFrame);
  return Math.floor(raw * 10) / 10;
}

function updateProjectiles(dt){
  for (const p of projectiles){
    if (!p.alive) continue;
    p.frameCount++;
    const step = p.dir.clone().multiplyScalar(p.speed * dt);
    const next = p.pos.clone().add(step);
    p.traveled += step.length();

    const hitDummy = dummy.hp > 0 && next.distanceTo(new THREE.Vector3(dummy.position.x, next.y, dummy.position.z)) < dummy.radius + 0.06
      && next.y < 1.8 && next.y > 0;
    const outOfRange = p.traveled >= p.range;
    const outOfBounds = Math.abs(next.x) > WALL_HALF || Math.abs(next.z) > WALL_HALF || next.y < 0 || next.y > 8;

    if (hitDummy){
      const dmg = getShotDamage(p.frameCount);
      dummy.hp = Math.max(0, dummy.hp - dmg);
      updateDummyHpUI();
      if (dummy.hp === 0){
        killCount++;
        document.getElementById('kill-count').textContent = `撃破数: ${killCount}`;
        setTimeout(respawnDummy, 500);
      }
      spawnDecal(next);
      scene.remove(p.mesh);
      p.alive = false;
    } else if (outOfRange || outOfBounds){
      spawnDecal(next);
      scene.remove(p.mesh);
      p.alive = false;
    } else {
      p.pos.copy(next);
      p.mesh.position.copy(next);
    }
  }
  for (let i = projectiles.length - 1; i >= 0; i--){
    if (!projectiles[i].alive) projectiles.splice(i, 1);
  }
}

function updateWeapon(dt){
  const now = performance.now();
  // イカ状態では発射不可(2Dプロトタイプと同じ制約)。
  if (mouseDown && pointerLocked && form === 'human' && now - lastShotAt >= WEAPON.fireIntervalSec * 1000){
    lastShotAt = now;
    fireShot();
  }
  updateProjectiles(dt);
}

function updateInk(dt, firing){
  // インク回復不能時間は今回は簡略化し、発射していない間は常に自然回復する。
  if (!firing){
    player.ink = Math.min(player.maxInk, player.ink + player.regenRate * dt);
  }
  document.getElementById('ink-gauge-inner').style.width = (player.ink / player.maxInk * 100) + '%';
}

// ==========================================================================
// Main loop
// ==========================================================================
updateDummyHpUI();
let lastTime = performance.now();
function loop(now){
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  const firing = mouseDown && pointerLocked && form === 'human';
  // メイン射撃中(firing)、またはサブ・スペシャルの構えモーション中に相当する
  // Eキー長押し(throwAimHeld)のいずれかがtrueなら加速度が2倍になる状態。
  const actionState = firing || throwAimHeld;
  updateMovement(dt, firing, actionState);
  updateWeapon(dt);
  updateInk(dt, firing);
  updateCamera(dt);
  updatePlayerVisual();
  updateReticle();
  document.getElementById('fov-state').textContent =
    `FOV: ${camera.fov.toFixed(1)}°(${throwAimHeld ? '投擲構え' : (form === 'squid' ? 'イカ状態' : 'ヒト状態')})`;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
