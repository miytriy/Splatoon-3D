<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>インク・ペイントシステム — 3D TPS プロトタイプ (塗り移植版)</title>
<style>
  :root{
    --bg: #14161c;
    --panel: #1d2029;
    --ink: #ff5a1f;
    --ink-dark: #b5390f;
    --text: #eef0f4;
    --muted: #7d8394;
    --accent: #33e6c0;
  }
  html,body{
    margin:0; height:100%; overflow:hidden;
    background: var(--bg); color: var(--text);
    font-family: "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  #app{ position:relative; width:100vw; height:100vh; }
  canvas{ display:block; }

  #hud{
    position:absolute; top:12px; left:12px; right:12px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; font-variant-numeric: tabular-nums;
  }
  .card{
    background: rgba(13,14,18,.72); backdrop-filter: blur(4px);
    border: 1px solid #33384a; border-radius:8px; padding:8px 12px;
  }
  .label{ font-size:11px; color: var(--muted); letter-spacing:.08em; }
  #ink-gauge-outer{
    width:130px; height:8px; border-radius:4px; background:#0b0c10;
    overflow:hidden; margin-top:6px; border:1px solid #33384a;
  }
  #ink-gauge-inner{
    height:100%; width:100%;
    background: linear-gradient(90deg, var(--ink-dark), var(--ink));
    transition: width .08s linear;
  }
  #dummy-hp-outer{
    width:130px; height:6px; border-radius:3px; background:#0b0c10;
    overflow:hidden; margin-top:4px; border:1px solid #33384a;
  }
  #dummy-hp-inner{
    height:100%; width:100%;
    background: var(--accent);
    transition: width .08s linear;
  }

  #reticle{
    position:absolute; top:0; left:0; width:0; height:0;
    pointer-events:none;
  }
  .reticle-ring{
    position:absolute; top:50%; left:50%; width:15px; height:15px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1.6px solid rgba(255,255,255,.92);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4);
  }
  .reticle-dot{
    position:absolute; top:50%; left:50%; width:4px; height:4px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background: rgba(255,255,255,.95);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4);
  }
  /* 弾の拡散(spreadDeg)がこのラインの位置まで届く可能性がある、という
     目安を表す4本の線。中心からの距離は毎フレームJSで更新する。 */
  .reticle-line{
    position:absolute;
    background: rgba(255,255,255,.92);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4);
    transform:translate(-50%,-50%);
  }
  .reticle-line.diagonal{ width:2px; height:13px; }

  /* レティクル反応射程内で壁・床・対象に実際に弾が当たる位置へ出す
     ターゲットレティクル。中央固定の追尾レティクル(#reticle)とは別物で、
     ワールド上の着弾候補点を毎フレーム画面座標へ投影して配置する。 */
  #target-reticle{
    position:absolute; top:0; left:0; width:0; height:0;
    pointer-events:none; display:none;
  }
  .target-ring{
    position:absolute; top:0; left:0; width:26px; height:26px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:2px solid #ff9a1f;
    box-shadow: 0 0 0 1px rgba(0,0,0,.45), 0 0 6px rgba(255,120,20,.6);
  }
  .target-x{
    position:absolute; top:0; left:0; width:26px; height:26px;
    transform:translate(-50%,-50%);
    display:none;
  }
  .target-x span{
    position:absolute; top:50%; left:50%; width:17px; height:2px;
    background:#ff9a1f; box-shadow:0 0 0 1px rgba(0,0,0,.45);
    transform-origin:center;
  }
  .target-x span:first-child{ transform:translate(-50%,-50%) rotate(45deg); }
  .target-x span:last-child{ transform:translate(-50%,-50%) rotate(-45deg); }

  #pointerlock-prompt{
    position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    background: rgba(13,14,18,.85); backdrop-filter: blur(4px);
    border: 1px solid #33384a; border-radius:8px;
    padding:9px 16px; text-align:center; cursor:pointer;
    font-size:12px; color: var(--muted); line-height:1.5;
    z-index:40; max-width:360px;
  }
  #pointerlock-prompt b{ color: var(--text); }
  #pointerlock-prompt.hidden{ display:none; }

  #scope-note{
    position:absolute; bottom:12px; left:12px; max-width:280px;
    font-size:10px; color: var(--muted); line-height:1.6;
    background: rgba(13,14,18,.6); border:1px solid #262a36;
    border-radius:6px; padding:6px 9px; pointer-events:none;
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="card">
      <div class="label">インク残量</div>
      <div id="ink-gauge-outer"><div id="ink-gauge-inner"></div></div>
    </div>
    <div class="card">
      <div class="label">塗りポイント</div>
      <div id="paint-points-value" style="font-weight:700; font-size:20px; color:var(--accent);">0pt</div>
    </div>
    <div class="card" style="text-align:right">
      <div class="label">ダミーHP</div>
      <div id="dummy-hp-outer"><div id="dummy-hp-inner"></div></div>
      <div id="kill-count" class="label" style="margin-top:6px;">撃破数: 0</div>
    </div>
  </div>
  <div id="reticle">
    <div class="reticle-ring"></div>
    <div class="reticle-dot"></div>
    <div id="reticle-line-ne" class="reticle-line diagonal"></div>
    <div id="reticle-line-nw" class="reticle-line diagonal"></div>
    <div id="reticle-line-se" class="reticle-line diagonal"></div>
    <div id="reticle-line-sw" class="reticle-line diagonal"></div>
  </div>
  <div id="target-reticle">
    <div class="target-ring"></div>
    <div class="target-x"><span></span><span></span></div>
  </div>
  <div id="fov-state" class="label" style="position:absolute; top:12px; left:50%; transform:translateX(-50%); background:rgba(13,14,18,.6); padding:4px 10px; border-radius:6px; border:1px solid #262a36;">FOV: 55.0°(ヒト状態)</div>
  <div id="scope-note">移動・TPS視点・スプラシューター1丁の発射に加え、塗り判定(インクの蓄積・自陣インク判定・塗りポイント)を2Dプロトタイプから移植済み。<br>複数武器/サブ/スペシャルは未実装(次フェーズ)。<br>右クリック長押し=イカ状態(自陣インク上なら潜行・急速回復)／Eキー長押し=投擲構え(FOVのみ、投擲自体は未実装)。</div>
  <div id="pointerlock-prompt"><b>クリックしてマウスルックを有効化</b><br>WASD移動／マウスで視点／左クリックで発射</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ==========================================================================
   3D TPS PROTOTYPE — scope for this milestone
   --------------------------------------------------------------------------
   Ported from the 2D top-down ink prototype. This step covers:
     - third-person camera (mouse look via pointer lock, orbiting behind
       the player at a fixed offset)
     - WASD movement relative to camera facing
     - a single weapon (スプラシューター) firing on left-click hold, with
       the same fire-interval / ink-cost / range figures as the 2D version
     - a practice dummy target with HP/respawn, so the feel of the weapon
       can be judged directly
     - インク塗りシステム(2Dプロトタイプ ink-paint-prototype.html からの
       移植)。coverageLayer/paintLayerの二層構成を、ワールドのXZ平面
       (地面)へマッピングしたキャンバスとして持ち、CanvasTextureとして
       地面のマテリアルに貼り付ける形で3D化した。着弾塗り(伸び形状)・
       足元塗り・中間塗り・塗りポイントの実面積集計はすべて2D版と
       同じロジックをそのまま使っている。「自陣インク上か」の判定
       (isOnOwnInk/sampleInkAt)もcoverageLayerの実データを直接参照する
       ようになり、以前の「デカールへの近接判定による近似」は廃止した。

   NOT yet ported (left for a later pass, once this movement/camera/weapon
   core feels right):
     - the other two weapons, sub weapon, both specials
     - walls/obstacles, HUD overlays (pause/menu/customize)
     - チーム(敵)インクの概念 — このプロトタイプには自陣インクしか無い
       ため、「敵インク上でイカダッシュ不可」は引き続き未実装

   Movement now uses a real acceleration model (see getCurrentAccelMPerS2 /
   getTargetSpeedMPerS / updateMovement): base 0.01m/F² accel toward the
   weight-class-correct human/squid target speed, 0.02m/F² during
   firing/sub-special action states, and a Bold-Marker-only 0.015m/F²
   squid exception (currently unused since WEAPON.isBoldMarker is false).

   Camera fix: the camera previously sat IN FRONT of the player (offset
   along +forward instead of -forward), and the WASD/shot-direction math
   had a matching sign flip that happened to cancel out internally. Both
   are now unified through getAimDirection()/getFlatForward()/
   getFlatRight() so camera look direction, movement direction, and shot
   direction all agree, with the camera correctly trailing behind the
   player along the aim direction.

   FOV: camera.fov IS the vertical FOV (fovy) in Three.js — fovx is derived
   internally from fovy+aspect, so the given table's fovy values (55°/60°/
   38°) are set directly, with a smooth lerp between states. squid form and
   投擲構え are stubbed as FOV-only states for now (right-click / E key)
   since the underlying mechanics aren't ported yet.
   ========================================================================== */

// --------------------------------------------------------------------------
// Unit system: reuse the 2D prototype's line/meter convention so weapon
// numbers stay comparable. 1 line = 5m. Real-world Three.js units below are
// meters (1 unit = 1m).
// --------------------------------------------------------------------------
const METERS_PER_LINE = 5;
const DU_PER_METER = 10;
const FPS = 60;
function duPerFrameToMPerSec(v){ return (v / DU_PER_METER) * FPS; }
// DU/F² (1フレームあたりの速度変化量、DU単位) を m/s² へ変換。
// 1フレーム = 1/FPS 秒なので、フレーム基準の加速度を秒基準にするには FPS² を掛ける。
function duPerF2ToMPerS2(v){ return (v / DU_PER_METER) * FPS * FPS; }
function framesToSeconds(f){ return f / FPS; }
function linesToMeters(n){ return n * METERS_PER_LINE; }

// スプラシューター — same figures as the 2D prototype (see
// ink-paint-prototype.html WEAPONS[0] for the annotated source/derivation).
const WEAPON = {
  name: 'スプラシューター',
  weightClass: 'medium', // 中量級。スプラシューターは重量/軽量どちらの専用ギア補正も前提にしない標準速度帯のブキとして分類。
  isBoldMarker: false,   // ボールドマーカーのみイカ速の加速度が特別(基準の1.5倍)になるための判定フラグ。
  maxRangeLines: 2.7,
  fireIntervalSec: framesToSeconds(6),
  inkPerShot: 100 / 108,
  speedDU: 22.66,
  damageFalloff: { startFrame: 8, startDamage: 36.0, endFrame: 40, endDamage: 18.0, perFrameDecay: 0.5625 },
  spreadDeg: 4.86,

  // ---- 塗り関連パラメータ(2Dプロトタイプ ink-paint-prototype.html の
  // スプラシューターの実測値をそのまま移植) ----
  splatRadiusFalloff: { startDist: 0.22, startRadius: 0.39, endDist: 4.00, endRadius: 0.34 }, // 着弾塗り半径(ライン)
  stretchFalloff: { startDist: 0.22, startRatio: 2.24, endDist: 4.00, endRatio: 1.12 },       // 着弾塗りの前方伸び率
  footPaintAvgInterval: 4,     // 足元塗り: 平均4発に1回
  footPaintRadiusLines: 0.41,  // 足元塗り半径(ライン)
  midPaintIntervalLines: 1.84, // 中間塗りの間隔(ライン)
  midPaintAvgPerShot: 1.5,     // 中間塗りの1発あたり平均個数
  midPaintRadiusLines: 0.29,   // 中間塗りの半径(ライン)
  singleShotPaintPoints: 4.0,  // 単発塗りポイント(1発で塗れる上限pt)

  // ========================================================================
  // 弾道パラメータ (A)~(H) — ①直進状態 → ②減速状態 → ③自由落下状態、の
  // 3段階遷移モデル(ユーザー提供の仕様に準拠)。
  //   (A)初速 / (B)直進フレーム数 / (C)直進終了時最大速度 /
  //   (D)減速時の空気抵抗 / (E)減速時の重力 / (F)減速状態の下限速度(XZ・Y別) /
  //   (G)自由落下時の空気抵抗 / (H)自由落下時の重力
  //
  // 数値の出典について:
  //   (A)はダメージ計算などで既に使っているspeedDUと同じ値(実測に基づく確定値)。
  //   (H)と(G)は、スプラトゥーン3攻略Wikiの「システム詳細仕様」ページにある
  //   「(自由落下時の重力は)シューター種では全て0.016に設定されている」
  //   「(自由落下時の空気抵抗は)シューター種ではなぜか.52ガロンにのみ
  //   パラメータが存在し0.02となっている(=他シューターは0)」という記述に
  //   基づく、シューター種共通の確定(に近い)値。
  //   (B)(C)(D)(E)(F)はスプラシューター個別の実測データが見つからなかった
  //   ため、【要検証】の暫定値。同Wikiの定性的な記述
  //   (「シューター種は(A)に対して(C)が総じて小さく、ブレーキ状態になると
  //   極端に減速する」「実測ではシューター系の弾はブレーキ開始から4F程度で
  //   自由落下状態に移行しているように見える」)から、それらしい挙動になる
  //   よう仮に置いた値。正確な数値が判明次第ここだけ差し替えれば良いように、
  //   他のロジックとは独立させてある。
  // ========================================================================
  ballistics: {
    A_initialSpeedDU: 22.66,     // 確定値(=speedDUと同じ)
    B_straightFrames: 8,         // 【要検証・暫定】
    C_brakeMaxSpeedDU: 5.5,      // 【要検証・暫定】(A)よりかなり小さい値にしてある
    D_brakeDrag: 0.35,           // 【要検証・暫定】1Fごとに(1-D)倍
    E_brakeGravityDU: 0.05,      // 【要検証・暫定】DU/F²相当(Y速度から毎F減算)
    F_floorSpeedDU: { xz: 0.3, y: 0.3 }, // 【要検証・暫定】これを共に下回ると自由落下へ
    G_freefallDragDU: 0,         // シューター種共通の確定値(.52ガロン以外は0)
    H_freefallGravityDU: 0.016,  // シューター種共通の確定値(DU/F²相当)
  },
};

// (B)(C)(D)(E)(F)(G)(H) をm/s・m/s²系へ変換した実働定数。DU/F系の生値は
// WEAPON.ballistics側にコメント付きで残し、ここではシミュレーションで直接
// 使う形に変換したものだけをまとめておく。
const BALLISTICS_MPS = (() => {
  const b = WEAPON.ballistics;
  return {
    straightFrames: b.B_straightFrames,
    brakeMaxSpeed: duPerFrameToMPerSec(b.C_brakeMaxSpeedDU),
    brakeDrag: b.D_brakeDrag,               // 無次元(1Fあたりの減衰率)なのでそのまま
    brakeGravity: duPerF2ToMPerS2(b.E_brakeGravityDU),
    floorSpeedXZ: duPerFrameToMPerSec(b.F_floorSpeedDU.xz),
    floorSpeedY: duPerFrameToMPerSec(b.F_floorSpeedDU.y),
    freefallDrag: b.G_freefallDragDU,       // 無次元
    freefallGravity: duPerF2ToMPerS2(b.H_freefallGravityDU),
  };
})();

// 「レティクル反応射程」— 実際の弾の飛距離/ダメージ射程(maxRangeLines)とは
// 別の概念。照準を合わせた際に対象レティクル(オレンジの◯/◯+×)が
// 表示されるかどうかだけを決める判定距離で、公式の分離データが無いため
// 現状は暫定的にmaxRangeLinesと同値にしている(将来、実測値が分かれば
// ここだけ独立して調整する)。
const RETICLE_RESPONSE_RANGE_LINES = WEAPON.maxRangeLines;

// ==========================================================================
// 移動速度テーブル (DU/フレーム) — ブキ重量ごとの実データ。
// ヒト速は自分のインク上/塗れない床の上でも変化しない(仕様通り一定)。
// イカ速は「自陣インク上」「インクのない床・塗れない床」で分岐する。
// 「敵インク上ではイカダッシュ不可(泳げない)」は、このプロトタイプに
// まだチーム/敵インクの概念が無いため未実装(コメントで明記のみ)。
// ==========================================================================
const HUMAN_SPEED_DU_PER_F = { light: 1.04, medium: 0.96, heavy: 0.88 };
const SQUID_SPEED_ON_INK_DU_PER_F = { light: 2.016, medium: 1.920, heavy: 1.728 };
const SQUID_SPEED_OFF_INK_DU_PER_F = 0.66; // 全ブキ重量共通、ギアの影響も受けない

// ==========================================================================
// 加速度の基準値 (DU/F²)
//  - 基準: 0.1 (ヒト速・イカ速・重量問わず、通常はこの値で目標速度へ加減速)
//  - ボールドマーカーのみイカ速加速度が 0.15 (基準の1.5倍。ヒト速は基準のまま)
//  - メイン射撃中／サブ・スペシャル攻撃中・構えモーション中は 0.2 (基準の2倍)。
//    ボールドマーカーでこの状態になっても 0.15×2=0.3 にはならず 0.2 のまま。
// ==========================================================================
const ACCEL_BASE_DU_PER_F2 = 0.1;
const ACCEL_BOLD_SQUID_DU_PER_F2 = 0.15;
const ACCEL_ACTION_DU_PER_F2 = 0.2;

const player = {
  ink: 100, maxInk: 100,
  regenRate: 10, // ink/sec — ヒト状態のときの自然回復レート(2D版と同じ)
  swimRegenRate: 32, // ink/sec — イカ状態かつ自陣インク上のときの急速回復レート(2D版から移植)
  vx: 0, vz: 0, // 現在の実速度 (m/s, ワールド座標)。加速度システムにより毎フレーム目標速度へ漸近する。
  humanSpeed: duPerFrameToMPerSec(HUMAN_SPEED_DU_PER_F[WEAPON.weightClass]),
  squidSpeedOnInk: duPerFrameToMPerSec(SQUID_SPEED_ON_INK_DU_PER_F[WEAPON.weightClass]),
  squidSpeedOffInk: duPerFrameToMPerSec(SQUID_SPEED_OFF_INK_DU_PER_F),
  shootSpeed: 2.6,  // m/s while firing — 公式テーブルに射撃中速度の値は含まれないため、2Dプロトタイプ踏襲の暫定値のまま
};

// ==========================================================================
// Scene setup
// ==========================================================================
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161c);
scene.fog = new THREE.Fog(0x14161c, 40, 90);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 500);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
app.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Lighting
scene.add(new THREE.AmbientLight(0x8890a8, 0.7));
const sun = new THREE.DirectionalLight(0xfff2d8, 1.1);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

// Ground — a practice-range floor with a faint line grid, matching the
// 1-line(5m) spacing used in the 2D version's markers. The material's
// `map` gets replaced by the paint system's CanvasTexture further below
// (see "インク塗りシステム"), once ARENA_SIZE/WALL_HALF are available.
const ARENA_SIZE = linesToMeters(20); // 100m square, same order of size as the 2D canvas arena
const groundGeo = new THREE.PlaneGeometry(ARENA_SIZE, ARENA_SIZE);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x2a2d38, roughness: 0.95 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(ARENA_SIZE, ARENA_SIZE / METERS_PER_LINE, 0x46dc8c, 0x555b6e);
grid.position.y = 0.01;
grid.material.opacity = 0.35;
grid.material.transparent = true;
scene.add(grid);

// Boundary walls (simple visual + collision box) so the player can't walk
// off the practice range.
const WALL_HALF = ARENA_SIZE / 2;
function clampToArena(x, z, margin){
  return {
    x: Math.max(-WALL_HALF + margin, Math.min(WALL_HALF - margin, x)),
    z: Math.max(-WALL_HALF + margin, Math.min(WALL_HALF - margin, z)),
  };
}

// ==========================================================================
// インク塗りシステム(2Dプロトタイプ ink-paint-prototype.html からの移植)
// --------------------------------------------------------------------------
// 2D版のcoverageLayer/paintLayerの二層構成をそのまま踏襲する:
//   coverageLayer: wiki準拠の形状のみを描く「データ層」。塗りポイントの
//     集計(tickPaintPoints)と自陣インク判定(sampleInkAt)は必ずこちらを
//     参照する。
//   paintLayer: coverageLayerと同じコア形状 + 装飾(タンドリル/飛沫)を
//     加えた「見た目の層」。CanvasTextureとして地面のマテリアルへ直接
//     貼り付ける。
// 2D版は「画面ピクセル=ワールド座標」だったが、3D化にあたって「ワールドの
// XZ平面(地面)を真上から見た正方形のキャンバス」へマッピングする形に
// 変更した。ワールド座標(メートル)⇔キャンバス座標(px)の変換は
// worldToMapX()/worldToMapZ()で行う。
// 地面はrotation.x=-Math.PI/2で回転しているため、ローカルY(=テクスチャV)は
// ワールドZの符号反転にあたるが、CanvasTextureの既定flipY(=true、canvas行
// 0→V=1に写す)がちょうどこれを相殺するため、mapZがワールドZに正比例する
// 素直なマッピングのままでテクスチャの向きが一致する(詳細は各所コメント参照)。
// ==========================================================================
const MAP_PIXELS_PER_METER = 12; // 塗りキャンバスの解像度(px/m)
const MAP_SIZE_PX = Math.round(ARENA_SIZE * MAP_PIXELS_PER_METER);

const paintLayer = document.createElement('canvas');
paintLayer.width = MAP_SIZE_PX; paintLayer.height = MAP_SIZE_PX;
const pctx = paintLayer.getContext('2d');
// 床のベースカラーで塗りつぶしておく(未塗装部分がそのまま床の色に見えるように)。
pctx.fillStyle = '#2a2d38';
pctx.fillRect(0, 0, MAP_SIZE_PX, MAP_SIZE_PX);

const coverageLayer = document.createElement('canvas');
coverageLayer.width = MAP_SIZE_PX; coverageLayer.height = MAP_SIZE_PX;
const cctx = coverageLayer.getContext('2d');

const paintTexture = new THREE.CanvasTexture(paintLayer);
groundMat.map = paintTexture;
groundMat.color.set(0xffffff); // マップの色をそのまま使うため、マテリアル側の色乗算は白(無変換)にしておく
groundMat.needsUpdate = true;

const TEAM_COLOR_CSS = '#ff5a1f'; // TEAM_COLOR(3D側、下のplayerGroup等で使う0xff5a1f)のCSS表記
const TEAM_COLOR_RGB = [255, 90, 31];

function worldToMapX(wx){ return (wx + WALL_HALF) * MAP_PIXELS_PER_METER; }
function worldToMapZ(wz){ return (wz + WALL_HALF) * MAP_PIXELS_PER_METER; }
function metersToMapPx(m){ return m * MAP_PIXELS_PER_METER; }
function mapLines(n){ return metersToMapPx(linesToMeters(n)); } // ライン単位 → 塗りキャンバスpx

// --------------------------------------------------------------------------
// 有機的なインク跡の描画(2D版のblob生成ロジックをそのまま移植)。
// --------------------------------------------------------------------------
function blobPoints(cx, cy, baseRadius, numPoints, irregularity, stretchDir, stretchAmt){
  const points = [];
  for (let i = 0; i < numPoints; i++){
    const angle = (i / numPoints) * Math.PI * 2 + (Math.random() - 0.5) * (Math.PI / numPoints);
    let r = baseRadius * (0.75 + Math.random() * 0.35);
    if (Math.random() < 0.22) r *= 1.35 + Math.random() * 0.5; // occasional spike toward tendril territory
    if (stretchDir !== undefined){
      const rel = Math.atan2(Math.sin(angle - stretchDir), Math.cos(angle - stretchDir));
      const forwardFactor = (Math.cos(rel) + 1) / 2; // 0 = directly behind, 1 = directly ahead
      r *= 1 + (stretchAmt - 1) * forwardFactor;
    }
    r *= (1 + (Math.random() - 0.5) * 2 * irregularity);
    points.push({ x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r });
  }
  return points;
}

function drawSmoothBlobPath(pathCtx, points){
  const n = points.length;
  const first = points[0], last = points[n - 1];
  pathCtx.beginPath();
  pathCtx.moveTo((last.x + first.x) / 2, (last.y + first.y) / 2);
  for (let i = 0; i < n; i++){
    const p = points[i];
    const next = points[(i + 1) % n];
    const mx = (p.x + next.x) / 2, my = (p.y + next.y) / 2;
    pathCtx.quadraticCurveTo(p.x, p.y, mx, my);
  }
  pathCtx.closePath();
}

function drawCoreBlob(targetCtx, points){
  targetCtx.fillStyle = TEAM_COLOR_CSS;
  drawSmoothBlobPath(targetCtx, points);
  targetCtx.globalAlpha = 0.9 + Math.random() * 0.1;
  targetCtx.fill();
}

function paintTendril(cx, cy, angle, startDist, length, width){
  const dx = Math.cos(angle), dy = Math.sin(angle);
  const px = -dy, py = dx;
  const sx = cx + dx * startDist, sy = cy + dy * startDist;
  const ex = cx + dx * (startDist + length), ey = cy + dy * (startDist + length);
  const bend = (Math.random() - 0.5) * width * 3;
  const mx = cx + dx * (startDist + length * 0.55) + px * bend;
  const my = cy + dy * (startDist + length * 0.55) + py * bend;

  pctx.globalAlpha = 0.85 + Math.random() * 0.15;
  pctx.beginPath();
  pctx.moveTo(sx + px * width, sy + py * width);
  pctx.quadraticCurveTo(mx + px * width * 0.35, my + py * width * 0.35, ex, ey);
  pctx.quadraticCurveTo(mx - px * width * 0.35, my - py * width * 0.35, sx - px * width, sy - py * width);
  pctx.closePath();
  pctx.fill();

  if (Math.random() < 0.65){
    pctx.beginPath();
    pctx.arc(ex, ey, width * (1 + Math.random() * 1.4), 0, Math.PI * 2);
    pctx.fill();
  }
}

function paintSpatter(cx, cy, baseRadius, biasDir){
  const count = 4 + Math.floor(Math.random() * 5);
  for (let i = 0; i < count; i++){
    const angle = (biasDir !== undefined && Math.random() < 0.55)
      ? biasDir + (Math.random() - 0.5) * 1.3
      : Math.random() * Math.PI * 2;
    const dist = baseRadius * (1.05 + Math.random() * 1.4);
    const r = baseRadius * (0.04 + Math.random() * 0.1);
    pctx.globalAlpha = 0.65 + Math.random() * 0.35;
    pctx.beginPath();
    pctx.arc(cx + Math.cos(angle) * dist, cy + Math.sin(angle) * dist, r, 0, Math.PI * 2);
    pctx.fill();
  }
}

// Plain (non-directional) organic splat — 足元塗り・中間塗り用。
function paintSplat(cx, cy, baseRadius){
  const numPoints = 8 + Math.floor(Math.random() * 4);
  const corePoints = blobPoints(cx, cy, baseRadius, numPoints, 0.3);
  drawCoreBlob(cctx, corePoints);
  drawCoreBlob(pctx, corePoints);

  if (Math.random() < 0.6){
    const angle = Math.random() * Math.PI * 2;
    const dist = baseRadius * (0.15 + Math.random() * 0.3);
    const subPoints = blobPoints(cx + Math.cos(angle) * dist, cy + Math.sin(angle) * dist,
                                  baseRadius * (0.4 + Math.random() * 0.3), 7, 0.35);
    drawCoreBlob(cctx, subPoints);
    drawCoreBlob(pctx, subPoints);
  }

  paintSpatter(cx, cy, baseRadius);
  pctx.globalAlpha = 1;
}

// 着弾塗り(伸び形状) — 弾の飛行方向へ伸びるブロブ + タンドリル + 飛沫。
function paintSplatStretched(cx, cy, baseRadius, dirAngle, stretchRatio){
  const centerShift = baseRadius * (stretchRatio - 1) * 0.3;
  const bx = cx + Math.cos(dirAngle) * centerShift;
  const by = cy + Math.sin(dirAngle) * centerShift;

  const numPoints = 10 + Math.floor(Math.random() * 4);
  const corePoints = blobPoints(bx, by, baseRadius, numPoints, 0.28, dirAngle, stretchRatio);
  drawCoreBlob(cctx, corePoints);
  drawCoreBlob(pctx, corePoints);

  const secondaryCount = 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < secondaryCount; i++){
    const angle = dirAngle + (Math.random() - 0.5) * 2.2;
    const dist = baseRadius * (0.2 + Math.random() * 0.4);
    const sx = bx + Math.cos(angle) * dist, sy = by + Math.sin(angle) * dist;
    const subPoints = blobPoints(sx, sy, baseRadius * (0.35 + Math.random() * 0.3), 7, 0.35);
    drawCoreBlob(cctx, subPoints);
    drawCoreBlob(pctx, subPoints);
  }

  const tendrilCount = 3 + Math.floor(Math.random() * 4);
  for (let i = 0; i < tendrilCount; i++){
    const angle = Math.random() < 0.7
      ? dirAngle + (Math.random() - 0.5) * 1.5
      : Math.random() * Math.PI * 2;
    const startDist = baseRadius * (0.55 + Math.random() * 0.3);
    const length = baseRadius * (0.35 + Math.random() * 0.55) * (0.6 + stretchRatio * 0.4);
    const width = baseRadius * (0.08 + Math.random() * 0.07);
    paintTendril(bx, by, angle, startDist, length, width);
  }

  paintSpatter(bx, by, baseRadius, dirAngle);
  pctx.globalAlpha = 1;
}

// ワールド座標(メートル)から呼び出す用のラッパー。このプロトタイプには
// 壁オブジェクトが無いため、2D版のpaintSplatClippedにあったOBSTACLES判定は
// 省略している。
function paintSplatAtWorld(wx, wz, baseRadiusLines){
  paintSplat(worldToMapX(wx), worldToMapZ(wz), mapLines(baseRadiusLines));
}
function paintSplatStretchedAtWorld(wx, wz, baseRadiusLines, dirAngleXZ, stretchRatio){
  paintSplatStretched(worldToMapX(wx), worldToMapZ(wz), mapLines(baseRadiusLines), dirAngleXZ, stretchRatio);
}

// 着弾塗り半径・前方伸び率: 飛距離(ライン)に応じた線形補間(2D版と同じ式)。
function getSplatRadiusLines(weapon, traveledLines){
  const f = weapon.splatRadiusFalloff;
  if (!f) return 0.15;
  if (traveledLines <= f.startDist) return f.startRadius;
  if (traveledLines >= f.endDist) return f.endRadius;
  const t = (traveledLines - f.startDist) / (f.endDist - f.startDist);
  return f.startRadius + (f.endRadius - f.startRadius) * t;
}
function getStretchRatio(weapon, traveledLines){
  const f = weapon.stretchFalloff;
  if (!f) return 1;
  if (traveledLines <= f.startDist) return f.startRatio;
  if (traveledLines >= f.endDist) return f.endRatio;
  const t = (traveledLines - f.startDist) / (f.endDist - f.startDist);
  return f.startRatio + (f.endRatio - f.startRatio) * t;
}

// 足元塗り・中間塗りの発生判定(2D版と同じ「累積個数の差分」ロジック)。
function shouldFootPaint(weapon, shotIndex){
  if (weapon.footPaintAvgInterval === undefined) return false;
  const avg = weapon.footPaintAvgInterval;
  return Math.floor(shotIndex / avg) > Math.floor((shotIndex - 1) / avg);
}
function midPaintDropsForShot(weapon, shotIndex){
  if (weapon.midPaintAvgPerShot === undefined) return 0;
  const avg = weapon.midPaintAvgPerShot;
  return Math.floor(avg * shotIndex) - Math.floor(avg * (shotIndex - 1));
}
// 中間塗り: プレイヤー(発射地点)〜着弾点の間に固定パターンぶんのドロップを
// 配置する。ワールド座標(メートル)で開始/終了点を受け取り、内部でmap-pxへ
// 変換してから2D版と同じ間隔/個数ロジックで配置する。
function paintMidDotsWorld(weapon, startWX, startWZ, endWX, endWZ, shotIndex){
  if (weapon.midPaintIntervalLines === undefined) return;
  const startX = worldToMapX(startWX), startY = worldToMapZ(startWZ);
  const endX = worldToMapX(endWX), endY = worldToMapZ(endWZ);
  const dx = endX - startX, dy = endY - startY;
  const lenPx = Math.hypot(dx, dy);
  if (lenPx < 1) return;
  const ux = dx / lenPx, uy = dy / lenPx;
  const intervalPx = mapLines(weapon.midPaintIntervalLines);
  const maxByPattern = midPaintDropsForShot(weapon, shotIndex || 1);
  const maxByDistance = Math.floor(lenPx / intervalPx);
  const count = Math.min(maxByPattern, maxByDistance);
  for (let i = 1; i <= count; i++){
    const d = i * intervalPx;
    if (d >= lenPx) break;
    paintSplat(startX + ux * d, startY + uy * d, mapLines(weapon.midPaintRadiusLines));
  }
}

// --------------------------------------------------------------------------
// 塗りポイントの集計(2D版と同じ「ダウンサンプル+前回マスクとの差分」方式)。
// 換算係数(POINTS_PER_LINE_SQUARED)は2D版のユーザー実測に基づく暫定値を
// そのまま使う: 1p ≒ 0.1265 ライン²。
// --------------------------------------------------------------------------
const POINTS_PER_LINE_SQUARED = 1 / 0.1265;
const PAINT_SAMPLE_SIZE = 120;
const sampleCanvas = document.createElement('canvas');
sampleCanvas.width = PAINT_SAMPLE_SIZE; sampleCanvas.height = PAINT_SAMPLE_SIZE;
const sctx = sampleCanvas.getContext('2d');
let prevSampleMask = new Uint8Array(PAINT_SAMPLE_SIZE * PAINT_SAMPLE_SIZE);
let totalPaintPoints = 0;
const METERS_PER_SAMPLE_PIXEL = ARENA_SIZE / PAINT_SAMPLE_SIZE;
const LINE_AREA_PER_SAMPLE_PIXEL = Math.pow(METERS_PER_SAMPLE_PIXEL / METERS_PER_LINE, 2);

function tickPaintPoints(){
  sctx.clearRect(0, 0, PAINT_SAMPLE_SIZE, PAINT_SAMPLE_SIZE);
  sctx.drawImage(coverageLayer, 0, 0, PAINT_SAMPLE_SIZE, PAINT_SAMPLE_SIZE);
  const data = sctx.getImageData(0, 0, PAINT_SAMPLE_SIZE, PAINT_SAMPLE_SIZE).data;
  let newlyPainted = 0;
  for (let i = 0, px = 0; i < data.length; i += 4, px++){
    const isPainted = data[i + 3] > 40 ? 1 : 0;
    if (isPainted && !prevSampleMask[px]) newlyPainted++;
    prevSampleMask[px] = isPainted;
  }
  totalPaintPoints += newlyPainted * LINE_AREA_PER_SAMPLE_PIXEL * POINTS_PER_LINE_SQUARED;
  return totalPaintPoints;
}

// 単発塗りポイントの上限を厳守する(2D版と同じ「実測値と公称値の小さい方」方式)。
function creditCappedPaintPoints(nominalPoints){
  if (nominalPoints === undefined) return;
  const before = totalPaintPoints;
  tickPaintPoints();
  const areaBasedDelta = totalPaintPoints - before; // 常に0以上
  const credited = Math.min(areaBasedDelta, nominalPoints);
  totalPaintPoints = before + credited;
}

// 自陣インク上か: coverageLayer(データ層)からプレイヤー足元の1pxを読み取る。
// 旧バージョンでは「デカールへの近接判定」による近似だったが、実データを
// 直接参照する形に置き換えた。
function sampleInkAt(wx, wz){
  const mxPx = Math.min(Math.max(Math.round(worldToMapX(wx)), 0), MAP_SIZE_PX - 1);
  const myPx = Math.min(Math.max(Math.round(worldToMapZ(wz)), 0), MAP_SIZE_PX - 1);
  const data = cctx.getImageData(mxPx, myPx, 1, 1).data;
  if (data[3] < 40) return false; // 実質未塗装
  const dist = Math.abs(data[0] - TEAM_COLOR_RGB[0]) + Math.abs(data[1] - TEAM_COLOR_RGB[1]) + Math.abs(data[2] - TEAM_COLOR_RGB[2]);
  return dist < 90; // チーム色に十分近ければ自陣インクとみなす(ブロブのアルファ合成による誤差を許容)
}
function isOnOwnInk(){
  return sampleInkAt(playerGroup.position.x, playerGroup.position.z);
}

// --------------------------------------------------------------------------
// インクタンクUI — displayed only while in squid form (both surfaced and
// submerged), floating just beside the player, matching the reference
// screenshots. A rotationally-symmetric cylinder + rim, so no billboard
// rotation is needed — it reads the same from any horizontal angle.
// The fill cylinder sits in its own group pivoted at the bottom, so
// scaling fillGroup.scale.y grows/shrinks it upward from the base.
// --------------------------------------------------------------------------
function createInkTank(){
  const group = new THREE.Group();
  const H = 0.5, R = 0.13;
  const outerCyl = new THREE.Mesh(
    new THREE.CylinderGeometry(R, R, H, 14),
    new THREE.MeshStandardMaterial({ color: 0x0b0c10, roughness: 0.6 })
  );
  group.add(outerCyl);
  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(R, 0.015, 6, 16),
    new THREE.MeshStandardMaterial({ color: 0x33384a, roughness: 0.4 })
  );
  rim.rotation.x = Math.PI / 2;
  rim.position.y = H / 2;
  group.add(rim);

  const fillGroup = new THREE.Group();
  fillGroup.position.y = -H / 2; // pivot at the tank's base
  const fillCyl = new THREE.Mesh(
    new THREE.CylinderGeometry(R * 0.86, R * 0.86, H, 14),
    new THREE.MeshBasicMaterial({ color: 0x33e6c0 })
  );
  fillCyl.position.y = H / 2; // grows upward from fillGroup's base pivot
  fillGroup.add(fillCyl);
  group.add(fillGroup);

  return { group, fillGroup };
}
const inkTank = createInkTank();
inkTank.group.visible = false;
scene.add(inkTank.group);

const PLAYER_RADIUS = 0.45; // 移動時の壁クランプ用の簡易半径(下記の当たり判定カプセルとは別物)
const MUZZLE_HEIGHT = 0.95; // where shots originate, roughly shoulder height

// ==========================================================================
// 当たり判定(ヒト状態カプセル／イカ状態球) — ユーザー提供の実測値。
//   ヒト状態: 縦1.65m×横0.7m(直径)のカプセル型 → 半径0.35m、
//             カプセル全体の高さ1.65m(上下の半球キャップを含む)。
//   イカ状態: 直径1.6mの球体 → 半径0.8m。
// 現時点でプレイヤー自身を狙う敵はいないため、この判定はまず「練習用
// ダミー(人型)」の被弾判定に使う。将来、敵プレイヤーやCPUが実装された
// 際にも同じ関数(capsuleHitTest/sphereHitTest)を再利用できるよう、
// 汎用のユーティリティ関数として用意しておく。
// ==========================================================================
const HUMAN_HITBOX = { totalHeight: 1.65, radius: 0.35 };
const SQUID_HITBOX = { radius: 0.8, centerHeight: 0.4 }; // 球の中心の地面からの高さ(イカ状態モデルの重心付近)

// 点pointが、baseY(地面基準の底面高さ)に立つ縦向きカプセル(中心軸は
// (cx, cz)を通るY軸方向の線分)の内部にあるかどうかを判定する。
// extraRadiusは弾自体の大きさなどをカプセル側に加算するための余白。
function capsuleHitTest(point, cx, cz, baseY, hitbox, extraRadius){
  extraRadius = extraRadius || 0;
  const r = hitbox.radius;
  // カプセルの中心線分(直径分の半球キャップを除いた円柱部分)の上下端。
  const segBottom = baseY + r;
  const segTop = baseY + hitbox.totalHeight - r;
  const clampedY = Math.max(segBottom, Math.min(segTop, point.y));
  const dx = point.x - cx;
  const dz = point.z - cz;
  const dy = point.y - clampedY;
  const rr = r + extraRadius;
  return (dx * dx + dy * dy + dz * dz) <= rr * rr;
}

// 点pointが、baseY(地面基準)に立つイカ状態の球(中心はbaseY+centerHeight)の
// 内部にあるかどうかを判定する。
function sphereHitTest(point, cx, cz, baseY, hitbox, extraRadius){
  extraRadius = extraRadius || 0;
  const dx = point.x - cx;
  const dy = point.y - (baseY + hitbox.centerHeight);
  const dz = point.z - cz;
  const rr = hitbox.radius + extraRadius;
  return (dx * dx + dy * dy + dz * dz) <= rr * rr;
}

// --------------------------------------------------------------------------
// "自陣インク上か" は、ファイル上部の「インク塗りシステム」ブロックで
// 定義した isOnOwnInk()/sampleInkAt()(coverageLayerの実データを参照)を
// そのまま使う。以前あった「デカールへの近接判定による近似」はここでは
// 不要になったため削除した。
// --------------------------------------------------------------------------

// Switches between the human model, the surfaced squid model, and the
// fully-submerged look (both models hidden, only the ink puddle + tank UI
// showing) based on `form` and isOnOwnInk(). Also keeps the ink tank's
// fill level and position in sync every frame.
function updatePlayerVisual(){
  const submerged = form === 'squid' && isOnOwnInk();
  const showHuman = form === 'human';
  trunkMesh.visible = showHuman;
  capMesh.visible = showHuman;
  beakMesh.visible = showHuman;
  squidGroup.visible = form === 'squid' && !submerged;

  inkTank.group.visible = form === 'squid';
  if (inkTank.group.visible){
    inkTank.group.position.set(
      playerGroup.position.x + 0.55,
      playerGroup.position.y + 1.15,
      playerGroup.position.z
    );
    inkTank.fillGroup.scale.y = Math.max(0.001, player.ink / player.maxInk);
  }
}

const reticleRaycastTargets = [ground, dummyMesh];

// ==========================================================================
// TPS camera + mouse look
// --------------------------------------------------------------------------
// yaw/pitch drive both the camera orbit and the player's facing direction
// (movement and shots go where the camera looks, same as the 2D
// prototype's mouse-look-driven aimAngle). Camera sits behind/above the
// player at a fixed offset and looks at a point slightly above the
// player's head.
// ==========================================================================
let yaw = Math.PI;   // facing -Z initially (toward the dummy)
let pitch = -0.18;   // radians, positive = looking up, negative = looking down
const PITCH_MIN = -1.2, PITCH_MAX = 0.9;
const MOUSE_SENSITIVITY = 0.0022;
const CAMERA_DISTANCE = 7.8;
const CAMERA_HEIGHT = 3.4;

// --------------------------------------------------------------------------
// Aim direction: single source of truth for camera look direction, shot
// direction, and (flattened, pitch ignored) movement direction, so all
// three always agree with each other and with the on-screen crosshair.
// Standard yaw/pitch -> unit vector conversion; forward at yaw=0,pitch=0 is
// +Z, matching the player mesh's un-rotated facing (see beakMesh above).
// --------------------------------------------------------------------------
function getAimDirection(){
  return new THREE.Vector3(
    Math.sin(yaw) * Math.cos(pitch),
    Math.sin(pitch),
    Math.cos(yaw) * Math.cos(pitch)
  );
}
function getFlatForward(){
  return new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
}
function getFlatRight(){
  // Matches Three.js's actual camera-right basis (right = forward × up),
  // so A/D strafe the way they visually appear on screen. (Previously
  // this returned the mirrored vector, which is why A strafed right and
  // D strafed left — now swapped to the correct sign.)
  return new THREE.Vector3(-Math.cos(yaw), 0, Math.sin(yaw));
}

// ==========================================================================
// 視野角 (FOV) — vertical FOV per player state, taken directly as fovy since
// THREE.PerspectiveCamera.fov IS the vertical field of view in degrees (fovx
// is derived automatically from fovy+aspect, so no separate calculation is
// needed here — fovx = 2*atan(aspect*tan(fovy/2)) happens inside Three.js's
// projection matrix).
//   ヒト状態: 55° / イカ状態: 60° / 投擲構え(最大ズーム時): 38°
// Priority when multiple could apply: 投擲構え > イカ状態 > ヒト状態,
// since you can't throw while squidded (same constraint as the 2D version).
// ==========================================================================
const FOV_HUMAN = 55;
const FOV_SQUID = 60;
const FOV_THROW_AIM = 38;
const FOV_LERP_SPEED = 10; // higher = snappier zoom transition

function targetFov(){
  if (throwAimHeld) return FOV_THROW_AIM;
  if (form === 'squid') return FOV_SQUID;
  return FOV_HUMAN;
}

// --------------------------------------------------------------------------
// Player form (human/squid) — stubbed for this milestone: holding the right
// mouse button toggles the FOV-relevant state only (matches the 2D
// prototype's right-click-to-squid convention). Full squid mechanics (swim
// speed, submerging into own ink) are not ported yet.
// --------------------------------------------------------------------------
let form = 'human';
// 投擲構え (throw-aim zoom) — stubbed the same way: holding E previews the
// max-zoom FOV a sub-weapon/special throw would reach. No sub weapon is
// implemented yet, so this is camera-only for now.
let throwAimHeld = false;

let pointerLocked = false;
document.getElementById('pointerlock-prompt').addEventListener('click', () => {
  renderer.domElement.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === renderer.domElement;
  document.getElementById('pointerlock-prompt').classList.toggle('hidden', pointerLocked);
});
document.addEventListener('mousemove', e => {
  if (!pointerLocked) return;
  yaw -= e.movementX * MOUSE_SENSITIVITY;
  pitch -= e.movementY * MOUSE_SENSITIVITY;
  pitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, pitch));
});

function updateCamera(dt){
  playerGroup.rotation.y = yaw;

  const dir = getAimDirection();
  // Camera sits BEHIND the player along the aim direction (subtract dir),
  // offset up to shoulder height, then pulled in slightly when looking far
  // up/down so it doesn't swing too wide.
  const distFactor = CAMERA_DISTANCE * (0.75 + 0.25 * Math.cos(pitch));
  const desiredPos = playerGroup.position.clone()
    .add(new THREE.Vector3(0, CAMERA_HEIGHT, 0))
    .addScaledVector(dir, -distFactor);

  // Simple raycast-free ground clamp so the camera never dips below floor.
  desiredPos.y = Math.max(desiredPos.y, 0.6);
  camera.position.copy(desiredPos);

  // Look along the same aim direction the crosshair/shots use, from a point
  // just above the player's head — keeps camera, crosshair, and shot
  // direction all in agreement.
  const lookTarget = playerGroup.position.clone()
    .add(new THREE.Vector3(0, 1.3, 0))
    .addScaledVector(dir, 10);
  camera.lookAt(lookTarget);

  // Smoothly lerp toward the state-appropriate FOV rather than snapping,
  // matching the "だんだんズームされる" (gradual zoom) description.
  const t = 1 - Math.exp(-FOV_LERP_SPEED * dt);
  camera.fov += (targetFov() - camera.fov) * t;
  camera.updateProjectionMatrix();
}

// ==========================================================================
// Movement (WASD, relative to camera/player yaw — matches the 2D
// prototype's "aim direction independent of strafe direction" feel, since
// yaw here doubles as both facing and camera direction).
// ==========================================================================
const keys = { w:false, a:false, s:false, d:false };
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k in keys) keys[k] = true;
  // 投擲構え(スタブ): Eを押している間、最大ズーム時のFOVへ向けて滑らかに
  // ズームする。実際のサブウェポン投擲はまだ未実装。
  if (k === 'e') throwAimHeld = true;
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k in keys) keys[k] = false;
  if (k === 'e') throwAimHeld = false;
});

let mouseDown = false;

// ==========================================================================
// レティクル(照準)
// --------------------------------------------------------------------------
// 中央の円は常に画面中央=現在の照準方向(getAimDirection()と一致)に固定。
// 上下左右4本の線は、ブキの拡散角(WEAPON.spreadDeg)が実際に画面上で
// どこまで広がりうるかを、現在のFOV(投擲構え/イカ状態でのズームも含む)を
// 使って画面ピクセルへ投影した位置に毎フレーム配置し直す。
// ズームでFOVが狭くなるほど、同じ拡散角でも見た目の広がりは大きくなる
// (実際の弾のバラつきと視覚上のスケールが一致する)。
// ==========================================================================
const reticleNE = document.getElementById('reticle-line-ne');
const reticleNW = document.getElementById('reticle-line-nw');
const reticleSE = document.getElementById('reticle-line-se');
const reticleSW = document.getElementById('reticle-line-sw');
const RETICLE_LINE_HALF = 7; // .reticle-line の長辺の半分(px)。中心からの隙間を作らないための詰め代
const RETICLE_MIN_OFFSET = 9;   // 拡散角が非常に小さくても最低限これだけ中心から離す
const RETICLE_MAX_OFFSET = 160; // 画面外まで広がらないようにクランプ

function updateReticle(){
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;

  // 拡散は角度の半値(±spreadDeg/2)が実際の最大ブレ幅なので、その半値を
  // 現在のFOVの半値との比でスクリーン縦半分(px)に投影する。
  const halfSpreadRad = (WEAPON.spreadDeg / 2) * Math.PI / 180;
  const halfFovRad = camera.fov * Math.PI / 360;
  const rawOffset = (Math.tan(halfSpreadRad) / Math.tan(halfFovRad)) * cy;
  const offset = Math.max(RETICLE_MIN_OFFSET, Math.min(RETICLE_MAX_OFFSET, rawOffset)) + RETICLE_LINE_HALF;

  // 斜め四隅(NE/NW/SE/SW)に配置。各線は中心への放射方向ではなく、円周に
  // 沿う接線方向(±45°)に傾け、四隅がブラケットのように見える向きにする。
  const diag = offset * Math.SQRT1_2;
  reticleNE.style.left = (cx + diag) + 'px';
  reticleNE.style.top = (cy - diag) + 'px';
  reticleNE.style.transform = 'translate(-50%,-50%) rotate(-45deg)';

  reticleNW.style.left = (cx - diag) + 'px';
  reticleNW.style.top = (cy - diag) + 'px';
  reticleNW.style.transform = 'translate(-50%,-50%) rotate(45deg)';

  reticleSE.style.left = (cx + diag) + 'px';
  reticleSE.style.top = (cy + diag) + 'px';
  reticleSE.style.transform = 'translate(-50%,-50%) rotate(45deg)';

  reticleSW.style.left = (cx - diag) + 'px';
  reticleSW.style.top = (cy + diag) + 'px';
  reticleSW.style.transform = 'translate(-50%,-50%) rotate(-45deg)';
}

// ==========================================================================
// 対象レティクル(◯ / ◯+×) — レティクル反応射程内で、照準方向のレイが
// 実際に床・壁・対象にヒットする位置へ出す、追尾レティクルとは別物の表示。
// ヒットしたのが「敵」扱いのオブジェクト(userData.isEnemy)なら◯の中に
// ×を追加する。投擲構え中(throwAimHeld)は下のupdateThrowPreview()側の
// 弾道表示に切り替わるため、こちらは非表示にする。
// ==========================================================================
const raycaster = new THREE.Raycaster();
const targetReticleEl = document.getElementById('target-reticle');
const targetRingEl = targetReticleEl.querySelector('.target-ring');
const targetXEl = targetReticleEl.querySelector('.target-x');

function updateTargetReticle(){
  const showable = form === 'human' && !throwAimHeld && pointerLocked;
  if (!showable){
    targetReticleEl.style.display = 'none';
    return;
  }

  const dir = getAimDirection();
  raycaster.set(camera.position, dir);
  const hits = raycaster.intersectObjects(reticleRaycastTargets, false);
  const hit = hits.length ? hits[0] : null;

  const maxDist = linesToMeters(RETICLE_RESPONSE_RANGE_LINES);
  // 反応射程はプレイヤー位置からの距離で判定する(カメラは背後にあるため、
  // カメラ原点からの距離だとブキの実射程とズレるので補正)。
  const inRange = hit && hit.point.distanceTo(playerGroup.position) <= maxDist;

  if (!inRange){
    targetReticleEl.style.display = 'none';
    return;
  }

  const ndc = hit.point.clone().project(camera);
  if (ndc.z > 1){ // カメラの後ろ側に投影された(理論上ここには来ないが念のため)
    targetReticleEl.style.display = 'none';
    return;
  }

  const px = (ndc.x * 0.5 + 0.5) * window.innerWidth;
  const py = (1 - (ndc.y * 0.5 + 0.5)) * window.innerHeight;
  targetReticleEl.style.display = 'block';
  targetRingEl.style.left = px + 'px';
  targetRingEl.style.top = py + 'px';
  targetXEl.style.left = px + 'px';
  targetXEl.style.top = py + 'px';
  targetXEl.style.display = hit.object.userData.isEnemy ? 'block' : 'none';
}

// ==========================================================================
// 投擲プレビュー(弾道+着地点) — Eキー長押し(投擲構え)中、追尾レティクルを
// 消して代わりに表示する。サブウェポン自体はまだ未実装のため、初速・重力は
// 実データが無い暫定のプレースホルダー値(コメント参照)。実際のサブウェポンを
// 実装する際は、この2定数を公式データへ差し替えるだけで済むようにしてある。
// ==========================================================================
const THROW_PREVIEW_SPEED_MPS = 13;     // 仮値: 初速(m/s)。公式データ未反映。
const THROW_PREVIEW_GRAVITY_MPS2 = 18;  // 仮値: 重力加速度(m/s²)。公式データ未反映。
const THROW_ARC_SEGMENTS = 24;

const throwArcGeo = new THREE.BufferGeometry();
throwArcGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array((THROW_ARC_SEGMENTS + 1) * 3), 3));
const throwArcMat = new THREE.LineBasicMaterial({ color: 0xffe14d });
const throwArcLine = new THREE.Line(throwArcGeo, throwArcMat);
throwArcLine.visible = false;
scene.add(throwArcLine);

const throwLandingMat = new THREE.MeshBasicMaterial({ color: 0xffe14d, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
const throwLandingMesh = new THREE.Mesh(new THREE.RingGeometry(0.18, 0.28, 20), throwLandingMat);
throwLandingMesh.rotation.x = -Math.PI / 2;
throwLandingMesh.visible = false;
scene.add(throwLandingMesh);

function updateThrowPreview(){
  if (!throwAimHeld){
    throwArcLine.visible = false;
    throwLandingMesh.visible = false;
    return;
  }

  const origin = playerGroup.position.clone().add(new THREE.Vector3(0, MUZZLE_HEIGHT, 0));
  const dir = getAimDirection();
  const vx = dir.x * THROW_PREVIEW_SPEED_MPS;
  const vy = dir.y * THROW_PREVIEW_SPEED_MPS;
  const vz = dir.z * THROW_PREVIEW_SPEED_MPS;

  // 放物線 y(t) = originY + vy*t - 0.5*g*t² が地面(y=0)に到達する時刻を解く。
  const a = -0.5 * THROW_PREVIEW_GRAVITY_MPS2, b = vy, c = origin.y;
  const disc = b * b - 4 * a * c;
  const landingT = disc >= 0 ? (-b - Math.sqrt(disc)) / (2 * a) : 2.5;
  const tMax = Math.max(0.05, landingT);

  const positions = throwArcGeo.attributes.position.array;
  for (let i = 0; i <= THROW_ARC_SEGMENTS; i++){
    const t = (i / THROW_ARC_SEGMENTS) * tMax;
    const x = origin.x + vx * t;
    const y = Math.max(0, origin.y + vy * t - 0.5 * THROW_PREVIEW_GRAVITY_MPS2 * t * t);
    const z = origin.z + vz * t;
    positions[i * 3] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;
  }
  throwArcGeo.attributes.position.needsUpdate = true;
  throwArcGeo.computeBoundingSphere();
  throwArcLine.visible = true;

  const landX = origin.x + vx * tMax;
  const landZ = origin.z + vz * tMax;
  throwLandingMesh.position.set(landX, 0.03, landZ);
  throwLandingMesh.visible = true;
}
renderer.domElement.addEventListener('mousedown', e => {
  if (!pointerLocked){ renderer.domElement.requestPointerLock(); return; }
  if (e.button === 0) mouseDown = true;
  // イカ状態: 右クリック長押しの間、姿とFOV(60°)を切り替える。自陣インクの
  // 上ならインクの中に潜った見た目になる(isOnOwnInk()参照、coverageLayerの
  // 実データを参照)。泳ぐ速度変化・急速回復は下記updateMovement/updateInkで
  // 実際に反映される。
  if (e.button === 2) form = 'squid';
});
window.addEventListener('mouseup', e => {
  if (e.button === 0){
    mouseDown = false;
    burstShotCount = 0; // トリガーを離したら足元塗り・中間塗りのパターンをリセット
  }
  if (e.button === 2) form = 'human';
});
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

// ==========================================================================
// 加速度システム
// --------------------------------------------------------------------------
// 基準加速度は 0.01m/F²(0.1DU/F²)。スティックを全力で倒した際、この値で
// 1フレームごとに目標速度へ近づいていく。目標速度がゼロ(キーを離した)や
// 逆方向(反対キーを倒した)の場合の減速も、同じ加速度の値で速度が
// マイナス方向に変化していくだけ(=同じ式で加減速両方をカバーできる)。
//
// 状態による例外:
//   ・ボールドマーカーのみ、イカ速のときの加速度が 0.015m/F²(1.5倍)。
//     ヒト速の加速度は他ブキと同じ基準値のまま変化しない。
//   ・メイン射撃中、またはサブ・スペシャルの攻撃中/構えモーション中は、
//     加速度が 0.02m/F²(基準の2倍)になる。これらの動作中にイカ状態へ
//     切り替わった場合もこの値が優先して適用される(ボールドマーカーの
//     1.5倍とは重複しない=0.15×2の3倍にはならず、常に0.02のまま)。
//
// t = 最高速度 ÷ 加速度 で最高速到達までのフレーム数が求まる
// (例: ボールドマーカーのイカ速 2.016DU/F ÷ 0.15DU/F² = 13.44F ≈ 14F —
//  この関係は m/s ÷ m/s² = 秒 でも同様に成立するため、下記は秒基準の
//  dt積分で実装しても仕様と一致する)。
// ==========================================================================
function getCurrentAccelMPerS2(actionState){
  if (actionState) return duPerF2ToMPerS2(ACCEL_ACTION_DU_PER_F2);
  if (form === 'squid' && WEAPON.isBoldMarker) return duPerF2ToMPerS2(ACCEL_BOLD_SQUID_DU_PER_F2);
  return duPerF2ToMPerS2(ACCEL_BASE_DU_PER_F2);
}

// 現在の状態(ヒト/イカ、射撃中、自陣インク上か)から目標最高速度(m/s)を返す。
// ヒト速は仕様通り、インクの有無や床の種類による変化を持たない。
function getTargetSpeedMPerS(firing){
  if (form === 'squid'){
    // 「敵インク上ではイカダッシュ不可(泳げない)」は、このプロトタイプに
    // チーム/敵インクの概念がまだ無いため未実装。自陣インク判定は
    // coverageLayerの実データを見るisOnOwnInk()で行う。
    return isOnOwnInk() ? player.squidSpeedOnInk : player.squidSpeedOffInk;
  }
  return firing ? player.shootSpeed : player.humanSpeed;
}

function updateMovement(dt, firing, actionState){
  let moveX = 0, moveZ = 0;
  if (keys.w) moveZ -= 1;
  if (keys.s) moveZ += 1;
  if (keys.a) moveX -= 1;
  if (keys.d) moveX += 1;
  const hasInput = moveX !== 0 || moveZ !== 0;

  let targetVX = 0, targetVZ = 0;
  if (hasInput){
    const len = Math.hypot(moveX, moveZ);
    moveX /= len; moveZ /= len;

    // Movement stays flat (pitch ignored) and uses the same yaw-derived
    // forward/right basis as getAimDirection()/getFlatForward(), so 'W'
    // always walks toward where the camera/crosshair is pointing.
    const forward = getFlatForward(), right = getFlatRight();
    const worldX = -moveZ * forward.x + moveX * right.x;
    const worldZ = -moveZ * forward.z + moveX * right.z;

    const targetSpeed = getTargetSpeedMPerS(firing);
    targetVX = worldX * targetSpeed;
    targetVZ = worldZ * targetSpeed;
  }
  // 入力が無ければ目標速度はゼロ = 現在の加速度でブレーキがかかっていく

  const accel = getCurrentAccelMPerS2(actionState);
  const dvx = targetVX - player.vx;
  const dvz = targetVZ - player.vz;
  const dvLen = Math.hypot(dvx, dvz);
  const maxStep = accel * dt;

  if (dvLen <= maxStep || dvLen === 0){
    player.vx = targetVX;
    player.vz = targetVZ;
  } else {
    // 目標速度への差分ベクトルの向きへ、加速度分だけ速度を変化させる。
    // 逆方向入力時もこの式のまま(差分ベクトルが大きくなるだけ)で、
    // 同じ加速度でゼロを通過して減速→加速する挙動になる。
    player.vx += (dvx / dvLen) * maxStep;
    player.vz += (dvz / dvLen) * maxStep;
  }

  const nx = playerGroup.position.x + player.vx * dt;
  const nz = playerGroup.position.z + player.vz * dt;
  const clamped = clampToArena(nx, nz, PLAYER_RADIUS);
  playerGroup.position.x = clamped.x;
  playerGroup.position.z = clamped.z;
  // 壁でクランプされた軸は速度も止める(張り付いたまま速度だけ溜まるのを防止)。
  if (clamped.x !== nx) player.vx = 0;
  if (clamped.z !== nz) player.vz = 0;
}

// ==========================================================================
// Weapon: single-shot spawn, straight-line travel, dummy/range/bounds hit
// check. 着弾/失速/場外時には(旧バージョンの平坦なデカールに代わって)
// 実際にインク塗りシステム(paintImpactSplat)を呼び、着弾塗り(伸び形状)・
// 中間塗り・塗りポイント加算を行う。
// A crude exponential fallback is kept for any future weapon added without
// verified decel/freefall constants.
// ==========================================================================
const projectiles = [];
const projGeo = new THREE.SphereGeometry(0.05, 8, 8);
const projMat = new THREE.MeshBasicMaterial({ color: 0xffd8c2 });

let lastShotAt = 0;
let burstShotCount = 0; // マウス押しっぱなしの間の発射数(足元塗り・中間塗りのパターン管理用)

function fireShot(){
  if (player.ink < WEAPON.inkPerShot) return;
  player.ink -= WEAPON.inkPerShot;

  const spread = (Math.random() - 0.5) * WEAPON.spreadDeg * Math.PI / 180;
  const angle = yaw + spread;
  // Same aim-direction convention as the camera (getAimDirection()), so
  // shots always travel exactly where the crosshair/camera is pointing.
  const dir = new THREE.Vector3(
    Math.sin(angle) * Math.cos(pitch),
    Math.sin(pitch),
    Math.cos(angle) * Math.cos(pitch)
  ).normalize();

  const origin = playerGroup.position.clone().add(new THREE.Vector3(0, MUZZLE_HEIGHT, 0));
  const mesh = new THREE.Mesh(projGeo, projMat);
  mesh.position.copy(origin);
  scene.add(mesh);

  // (A)初速の方向・大きさで初期速度ベクトルを作る。直進状態は重力・空気抵抗の
  // 影響を受けないため、この速度ベクトルは①直進状態の間ずっと一定のまま。
  const b = WEAPON.ballistics;
  const initialSpeed = duPerFrameToMPerSec(b.A_initialSpeedDU);
  const vel = dir.clone().multiplyScalar(initialSpeed);

  burstShotCount++;
  // 足元塗り: 発数ベースの固定パターンで発生(2D版shouldFootPaint()と同じロジック)。
  if (shouldFootPaint(WEAPON, burstShotCount)){
    paintSplatAtWorld(playerGroup.position.x, playerGroup.position.z, WEAPON.footPaintRadiusLines);
  }

  projectiles.push({
    mesh,
    pos: origin.clone(),
    vel,                 // 現在の速度ベクトル(m/s)。フェーズに応じて毎F変化する。
    phase: 'straight',   // 'straight' → 'brake' → 'freefall'
    traveled: 0,
    range: linesToMeters(WEAPON.maxRangeLines),
    frameCount: 0,
    alive: true,
    startX: origin.x, startZ: origin.z,     // 中間塗りの経路計算用(発射地点)
    dirAngleXZ: Math.atan2(dir.z, dir.x),   // 着弾塗りの伸び方向(XZ平面上の角度)
    burstShotIndex: burstShotCount,         // 中間塗りの発数パターン用
  });
}

// 着弾時の塗り処理: 着弾塗り(伸び形状)＋中間塗り＋塗りポイント加算。
// 2D版のupdateProjectiles()内、着弾/命中時のcreditCappedPaintPoints()呼び
// 出しに相当する。
function paintImpactSplat(p, landPos){
  const traveledLines = p.traveled / METERS_PER_LINE;
  const radiusLines = getSplatRadiusLines(WEAPON, traveledLines);
  const stretchRatio = getStretchRatio(WEAPON, traveledLines);
  paintSplatStretchedAtWorld(landPos.x, landPos.z, radiusLines, p.dirAngleXZ, stretchRatio);
  paintMidDotsWorld(WEAPON, p.startX, p.startZ, landPos.x, landPos.z, p.burstShotIndex);
  creditCappedPaintPoints(WEAPON.singleShotPaintPoints);
}

function getShotDamage(frameNumber){
  const f = WEAPON.damageFalloff;
  if (frameNumber <= f.startFrame) return f.startDamage;
  if (frameNumber >= f.endFrame) return f.endDamage;
  const raw = f.startDamage - f.perFrameDecay * (frameNumber - f.startFrame);
  return Math.floor(raw * 10) / 10;
}

// 弾1発分、1フレーム(概念上)ぶんの速度ベクトルをフェーズに応じて更新する。
// dtが1/60秒ちょうどでない場合(可変フレームレート)は、フレーム相当数
// framesEquivだけこのステップを繰り返し適用することで、"1Fおきに"という
// 仕様の意味合い(離散フレーム更新)をできるだけ保つ。
function advanceProjectileVelocityOneFrame(p){
  const bm = BALLISTICS_MPS;
  if (p.phase === 'straight'){
    // (A)は重力・空気抵抗の影響を受けず一定。frameCountがBに達したら
    // 減速状態へ遷移する(遷移時、速度が(C)より速ければ(C)まで落とす)。
    if (p.frameCount >= bm.straightFrames){
      p.phase = 'brake';
      const speed = p.vel.length();
      if (speed > bm.brakeMaxSpeed && speed > 0){
        p.vel.multiplyScalar(bm.brakeMaxSpeed / speed);
      }
      // 「ブレーキ状態になった1F目から割合減速が適用される」ため、
      // このフレーム内でそのまま減速状態の処理へフォールスルーする。
    } else {
      return; // 直進中は速度ベクトルを変化させない
    }
  }

  if (p.phase === 'brake'){
    // 1F前の速度に(1-D)を乗算し、その後Y速度から(E)を減算する。
    p.vel.multiplyScalar(1 - bm.brakeDrag);
    p.vel.y -= bm.brakeGravity / FPS; // brakeGravityはm/s²なので1F分(1/FPS秒分)だけ適用

    // 下限速度(F)判定: XZ速度・Y速度がそれぞれの下限を下回った場合、
    // その軸は下限値まで引き上げる(向きは保ったまま)。
    const xzSpeed = Math.hypot(p.vel.x, p.vel.z);
    let xzBelowFloor = false, yBelowFloor = false;
    if (xzSpeed < bm.floorSpeedXZ){
      xzBelowFloor = true;
      if (xzSpeed > 1e-6){
        const scale = bm.floorSpeedXZ / xzSpeed;
        p.vel.x *= scale; p.vel.z *= scale;
      }
    }
    if (Math.abs(p.vel.y) < bm.floorSpeedY){
      yBelowFloor = true;
      p.vel.y = p.vel.y >= 0 ? bm.floorSpeedY : -bm.floorSpeedY;
    }
    // 両方が下限を下回っていたら自由落下状態へ移行。
    if (xzBelowFloor && yBelowFloor) p.phase = 'freefall';
    return;
  }

  if (p.phase === 'freefall'){
    // 空気抵抗(G)と重力(H)以外は減速状態と全く同じ計算式。
    p.vel.multiplyScalar(1 - bm.freefallDrag);
    p.vel.y -= bm.freefallGravity / FPS;
  }
}

function updateProjectiles(dt){
  for (const p of projectiles){
    if (!p.alive) continue;

    // 可変dtをFPS基準の「フレーム」単位に分解して、直進フレーム数(B)の
    // カウントや、1Fごとの割合減速が仕様通りの粒度で効くようにする。
    let remaining = dt;
    const frameDt = 1 / FPS;
    while (remaining > 0 && p.alive){
      const step = Math.min(remaining, frameDt);
      const isFrameBoundary = step >= frameDt - 1e-9;

      const moveVec = p.vel.clone().multiplyScalar(step);
      const next = p.pos.clone().add(moveVec);
      p.traveled += moveVec.length();

      // ヒト状態の当たり判定カプセル(直径0.7m×高さ1.65m)で練習用ダミーへの
      // ヒットを判定する。以前の単純な円距離判定より正確(縦方向の判定も
      // カプセル形状に基づく)。
      const hitDummy = dummy.hp > 0 && capsuleHitTest(
        next, dummy.position.x, dummy.position.z, 0, HUMAN_HITBOX, 0.05 /* 弾自体の半径ぶんの余白 */
      );
      const outOfRange = p.traveled >= p.range;
      const outOfBounds = Math.abs(next.x) > WALL_HALF || Math.abs(next.z) > WALL_HALF || next.y < 0 || next.y > 8;

      if (hitDummy){
        const dmg = getShotDamage(p.frameCount);
        dummy.hp = Math.max(0, dummy.hp - dmg);
        updateDummyHpUI();
        if (dummy.hp === 0){
          killCount++;
          document.getElementById('kill-count').textContent = `撃破数: ${killCount}`;
          setTimeout(respawnDummy, 500);
        }
        paintImpactSplat(p, next);
        scene.remove(p.mesh);
        p.alive = false;
      } else if (outOfRange || outOfBounds){
        paintImpactSplat(p, next);
        scene.remove(p.mesh);
        p.alive = false;
      } else {
        p.pos.copy(next);
        p.mesh.position.copy(next);
        if (isFrameBoundary){
          p.frameCount++;
          advanceProjectileVelocityOneFrame(p);
        }
      }
      remaining -= step;
    }
  }
  for (let i = projectiles.length - 1; i >= 0; i--){
    if (!projectiles[i].alive) projectiles.splice(i, 1);
  }
}

function updateWeapon(dt){
  const now = performance.now();
  // イカ状態では発射不可(2Dプロトタイプと同じ制約)。
  if (mouseDown && pointerLocked && form === 'human' && now - lastShotAt >= WEAPON.fireIntervalSec * 1000){
    lastShotAt = now;
    fireShot();
  }
  updateProjectiles(dt);
}

function updateInk(dt, firing){
  // インク回復不能時間は今回は簡略化し、発射していない間は常に回復する。
  // イカ状態かつ自陣インク上のときだけ急速回復(2D版のswimRegenRateを移植)。
  if (!firing){
    const rapid = form === 'squid' && isOnOwnInk();
    const rate = rapid ? player.swimRegenRate : player.regenRate;
    player.ink = Math.min(player.maxInk, player.ink + rate * dt);
  }
  document.getElementById('ink-gauge-inner').style.width = (player.ink / player.maxInk * 100) + '%';
}

// ==========================================================================
// Main loop
// ==========================================================================
updateDummyHpUI();
let lastTime = performance.now();
function loop(now){
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  const firing = mouseDown && pointerLocked && form === 'human';
  // メイン射撃中(firing)、またはサブ・スペシャルの構えモーション中に相当する
  // Eキー長押し(throwAimHeld)のいずれかがtrueなら加速度が2倍になる状態。
  const actionState = firing || throwAimHeld;
  updateMovement(dt, firing, actionState);
  updateWeapon(dt);
  updateInk(dt, firing);
  updateCamera(dt);
  updatePlayerVisual();
  updateReticle();
  updateTargetReticle();
  updateThrowPreview();
  // 投擲構え中(throwAimHeld)は追尾レティクルを消し、弾道プレビューに切り替える。
  document.getElementById('reticle').style.display = throwAimHeld ? 'none' : 'block';
  document.getElementById('fov-state').textContent =
    `FOV: ${camera.fov.toFixed(1)}°(${throwAimHeld ? '投擲構え' : (form === 'squid' ? 'イカ状態' : 'ヒト状態')})`;

  // 塗りキャンバスの内容をGPUテクスチャへ反映し、塗りポイントのHUD表示を更新する。
  paintTexture.needsUpdate = true;
  document.getElementById('paint-points-value').textContent = Math.round(totalPaintPoints) + 'pt';

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
